<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>WhatFont — Hover Typography Inspector & Live Font-Pairing Tester</title>
<style>
  * { box-sizing: border-box; }
  body { width: 400px; margin: 0; padding: 14px; background: #0f172a; color: #f8fafc; font-family: system-ui, -apple-system, sans-serif; }
  .hdr { display: flex; justify-content: space-between; align-items: center; margin-bottom: 4px; }
  h2 { margin: 0; font-size: 16px; color: #fbbf24; }
  .badge { background: rgba(245,158,11,0.2); color: #fde68a; border: 1px solid rgba(245,158,11,0.45); padding: 2px 8px; border-radius: 999px; font-size: 10px; font-weight: 700; }
  p.sub { margin: 0 0 8px; font-size: 11px; color: #94a3b8; }
  .card { background: #1e293b; border: 1px solid #334155; border-radius: 8px; padding: 8px 10px; margin-bottom: 8px; font-size: 11.5px; line-height: 1.5; }
  .lbl { font-size: 10px; font-weight: 800; color: #94a3b8; margin-bottom: 4px; }
  .pairings { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; margin-bottom: 8px; }
  .p-btn { background: #1e293b; color: #f1f5f9; border: 1px solid #334155; border-radius: 6px; padding: 7px; font-size: 11px; font-weight: 700; cursor: pointer; }
  .p-btn:hover { border-color: #f59e0b; color: #fbbf24; }
  button.primary { width: 100%; background: #f59e0b; color: #0f172a; border: none; border-radius: 6px; padding: 8px; font-size: 11.5px; font-weight: 800; cursor: pointer; }
</style>
</head>
<body>
  <div class="hdr">
    <h2>🔤 WhatFont</h2>
    <span class="badge">Fonts Ninja Pro Unlocked</span>
  </div>
  <p class="sub">Hover Typography Inspector & 1-Click Live Font-Pairing Tester</p>

  <div class="card" id="typeSpec">
    <div><strong>Heading (H1):</strong> <span id="hFont" style="color:#fbbf24;">Inter — 32px (700)</span></div>
    <div><strong>Body Copy:</strong> <span id="bFont" style="color:#38bdf8;">system-ui — 16px (Line 24px)</span></div>
  </div>

  <div class="lbl">LIVE PREVIEW GOOGLE FONT PAIRINGS ON ACTIVE TAB</div>
  <div class="pairings">
    <button class="p-btn" data-font="Inter">Inter (Modern UI)</button>
    <button class="p-btn" data-font="Plus Jakarta Sans">Plus Jakarta Sans</button>
    <button class="p-btn" data-font="Georgia">Georgia (Editorial)</button>
    <button class="p-btn" data-font="JetBrains Mono">JetBrains Mono</button>
  </div>

  <button class="primary" id="copyImportBtn">📋 Copy Google Fonts @import CSS</button>

  <div id="tm-subtle-donate" style="margin-top:8px;text-align:right;">
    <a href="https://influenzian-group.gitlab.io/Extensions/donate.html" target="_blank" rel="noopener" style="display:inline-block;padding:3px 9px;border-radius:6px;background:rgba(30,41,59,0.7);border:1px solid rgba(148,163,184,0.2);color:#94a3b8;font-size:10.5px;font-weight:600;text-decoration:none;">Donate</a>
  </div>

  <script src="popup.js"></script>
</body>
</html>
