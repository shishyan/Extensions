<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>MozAuthority — DA/PA Estimator & Link Highlighter</title>
<style>
  * { box-sizing: border-box; }
  body { width: 380px; margin: 0; padding: 14px; background: #0f172a; color: #f8fafc; font-family: system-ui, -apple-system, sans-serif; }
  h2 { margin: 0 0 4px; font-size: 15px; color: #38bdf8; display: flex; justify-content: space-between; align-items: center; }
  .badge { background: rgba(2,132,199,0.2); color: #7dd3fc; border: 1px solid rgba(56,189,248,0.45); padding: 2px 8px; border-radius: 999px; font-size: 10px; }
  p.sub { margin: 0 0 10px; font-size: 11px; color: #94a3b8; }
  .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; margin-bottom: 8px; }
  .box { background: #1e293b; border: 1px solid #334155; border-radius: 8px; padding: 8px; text-align: center; }
  .lbl { font-size: 10px; color: #94a3b8; }
  .val { font-size: 15px; font-weight: 800; color: #38bdf8; margin-top: 2px; }
  .card { background: #1e293b; border: 1px solid #334155; border-radius: 8px; padding: 9px; margin-bottom: 8px; font-size: 11px; }
  .row { display: flex; justify-content: space-between; margin-bottom: 4px; }
  button.act { width: 100%; background: #0284c7; color: #fff; border: none; padding: 8px; border-radius: 6px; font-weight: 800; font-size: 11px; cursor: pointer; }
</style>
</head>
<body>
  <h2><span>👑 MozAuthority</span><span class="badge">MozBar Pro Free</span></h2>
  <p class="sub">Domain/Page Authority (DA/PA) Scorer & Link Type Highlighter</p>

  <div class="grid">
    <div class="box"><div class="lbl">Domain Auth (DA)</div><div class="val" id="daVal">64</div></div>
    <div class="box"><div class="lbl">Page Auth (PA)</div><div class="val" id="paVal">58</div></div>
    <div class="box"><div class="lbl">Spam Score</div><div class="val" id="spamVal" style="color:#4ade80;">1%</div></div>
  </div>

  <div class="card">
    <div class="row"><span>🟢 Dofollow Links:</span><strong id="dfVal">0</strong></div>
    <div class="row"><span>🟠 Nofollow Links:</span><strong id="nfVal">0</strong></div>
    <div class="row"><span>🟣 Sponsored / UGC:</span><strong id="spVal">0</strong></div>
    <div class="row" style="margin-bottom:0;"><span>🔵 Internal vs External:</span><strong id="ieVal">0 / 0</strong></div>
  </div>

  <button id="hlBtn" class="act">🖍️ Toggle On-Page Link Highlighter</button>

  <div id="tm-subtle-donate" style="margin-top:8px;text-align:right;">
    <a href="https://www.paypal.com/cgi-bin/webscr?cmd=_donations&business=nagaraj957%40gmail.com&item_name=Support+Free+Open+Extensions&currency_code=USD" target="_blank" rel="noopener" style="display:inline-block;padding:3px 9px;border-radius:6px;background:rgba(30,41,59,0.7);border:1px solid rgba(148,163,184,0.2);color:#94a3b8;font-size:10.5px;font-weight:600;text-decoration:none;">Donate</a>
  </div>

  <script src="popup.js"></script>
</body>
</html>
