<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>BuiltStack — 45+ Technology Profiler & Wappalyzer Pro Alternative</title>
<style>
  * { box-sizing: border-box; }
  body { width: 395px; margin: 0; padding: 14px; background: #0f172a; color: #f8fafc; font-family: system-ui, -apple-system, sans-serif; }
  h2 { margin: 0 0 4px; font-size: 15px; color: #38bdf8; display: flex; justify-content: space-between; align-items: center; }
  .badge { background: rgba(56,189,248,0.2); color: #38bdf8; border: 1px solid rgba(56,189,248,0.4); padding: 2px 8px; border-radius: 999px; font-size: 10px; }
  p.sub { margin: 0 0 8px; font-size: 11px; color: #94a3b8; }
  .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; margin-bottom: 8px; }
  .box { background: #1e293b; border: 1px solid #334155; border-radius: 8px; padding: 6px; text-align: center; }
  .box .v { font-size: 14px; font-weight: 800; color: #38bdf8; }
  .box .k { font-size: 9.5px; color: #94a3b8; }
  .list { background: #1e293b; border: 1px solid #334155; border-radius: 8px; padding: 8px; height: 165px; overflow-y: auto; font-size: 11.5px; margin-bottom: 8px; }
  .item { display: flex; justify-content: space-between; align-items: center; padding: 5px 0; border-bottom: 1px solid #334155; }
  .item:last-child { border-bottom: none; }
  .cat { background: rgba(16,185,129,0.18); color: #34d399; padding: 2px 7px; border-radius: 999px; font-size: 10px; font-weight: 700; }
  .btns { display: flex; gap: 6px; }
  button.act { flex: 1; background: #0284c7; color: #fff; border: none; padding: 8px; border-radius: 6px; font-weight: 700; font-size: 11px; cursor: pointer; }
  button.act.sec { background: #334155; }
</style>
</head>
<body>
  <h2><span>🧱 BuiltStack Pro</span><span class="badge">50+ Tech Signatures</span></h2>
  <p class="sub">Detect Frameworks, CMS, E-Commerce, Pixels, CDNs, Payments & CRM</p>

  <div class="stats">
    <div class="box"><div class="v" id="techCount">0</div><div class="k">Detected Tech</div></div>
    <div class="box"><div class="v" id="scriptCount">0</div><div class="k">DOM Scripts</div></div>
    <div class="box"><div class="v" id="cssCount">0</div><div class="k">Stylesheets</div></div>
  </div>

  <div class="list" id="stackList">Scanning live DOM, scripts, cookies & meta headers...</div>

  <div class="btns">
    <button id="copyBtn" class="act">📋 Copy JSON Stack</button>
    <button id="csvBtn" class="act sec">📥 Export CSV</button>
  </div>

  <div id="tm-subtle-donate" style="margin-top:8px;text-align:right;">
    <a href="https://paypal.me/influenzian" target="_blank" rel="noopener" style="display:inline-block;padding:3px 9px;border-radius:6px;background:rgba(30,41,59,0.7);border:1px solid rgba(148,163,184,0.2);color:#94a3b8;font-size:10.5px;font-weight:600;text-decoration:none;">Donate</a>
  </div>

  <script src="popup.js"></script>
</body>
</html>
