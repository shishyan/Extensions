<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>ModHeader — HTTP Request/Response Header Studio & cURL Generator</title>
<style>
  * { box-sizing: border-box; }
  body { width: 410px; margin: 0; padding: 14px; background: #0f172a; color: #f8fafc; font-family: system-ui, -apple-system, sans-serif; }
  .hdr { display: flex; justify-content: space-between; align-items: center; margin-bottom: 4px; }
  h2 { margin: 0; font-size: 16px; color: #60a5fa; }
  .badge { background: rgba(59,130,246,0.2); color: #93c5fd; border: 1px solid rgba(59,130,246,0.45); padding: 2px 8px; border-radius: 999px; font-size: 10px; font-weight: 700; }
  p.sub { margin: 0 0 8px; font-size: 11px; color: #94a3b8; }
  .h-row { display: grid; grid-template-columns: 1fr 1.4fr; gap: 5px; margin-bottom: 5px; }
  input { background: #1e293b; color: #fff; border: 1px solid #334155; border-radius: 6px; padding: 6px 8px; font-size: 11px; outline: none; }
  .lbl { font-size: 10px; font-weight: 800; color: #94a3b8; margin: 8px 0 4px; }
  pre { background: #1e293b; border: 1px solid #334155; border-radius: 8px; padding: 8px; font-size: 10.5px; color: #34d399; margin: 0; max-height: 100px; overflow-y: auto; white-space: pre-wrap; }
  .btns { display: flex; gap: 6px; margin-top: 8px; }
  button.primary { flex: 1.2; background: #3b82f6; color: #fff; border: none; border-radius: 6px; padding: 8px; font-size: 11px; font-weight: 800; cursor: pointer; }
  button.sec { flex: 1; background: #1e293b; color: #e2e8f0; border: 1px solid #334155; border-radius: 6px; padding: 8px; font-size: 11px; font-weight: 700; cursor: pointer; }
</style>
</head>
<body>
  <div class="hdr">
    <h2>🛡️ ModHeader</h2>
    <span class="badge">ModHeader Pro Zero-Ad</span>
  </div>
  <p class="sub">Custom Request/Response Header Profiles • CORS Auditor • cURL / fetch()</p>

  <div id="headersList">
    <div class="h-row"><input class="hn" value="Authorization" /><input class="hv" value="Bearer eyJhbGciOiJIUzI1NiJ9" /></div>
    <div class="h-row"><input class="hn" value="X-API-Environment" /><input class="hv" value="staging-us-east-1" /></div>
    <div class="h-row"><input class="hn" value="X-Forwarded-For" /><input class="hv" value="203.0.113.42" /></div>
  </div>

  <div class="lbl">GENERATED CURL / FETCH() SNIPPET</div>
  <pre id="codeOut"></pre>

  <div class="btns">
    <button class="primary" id="copyCurlBtn">📋 Copy cURL Command</button>
    <button class="sec" id="copyFetchBtn">⚡ Copy fetch() JS</button>
  </div>

  <div id="tm-subtle-donate" style="margin-top:8px;text-align:right;">
    <a href="https://www.paypal.com/cgi-bin/webscr?cmd=_donations&business=nagaraj957%40gmail.com&item_name=Support+Free+Open+Extensions&currency_code=USD" target="_blank" rel="noopener" style="display:inline-block;padding:3px 9px;border-radius:6px;background:rgba(30,41,59,0.7);border:1px solid rgba(148,163,184,0.2);color:#94a3b8;font-size:10.5px;font-weight:600;text-decoration:none;">Donate</a>
  </div>

  <script src="popup.js"></script>
</body>
</html>
