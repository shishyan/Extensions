<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>OtterNotes — Live Meeting Caption Recorder & Action-Item Minutes</title>
<style>
  * { box-sizing: border-box; }
  body { width: 410px; margin: 0; padding: 14px; background: #0f172a; color: #f8fafc; font-family: system-ui, -apple-system, sans-serif; }
  .hdr { display: flex; justify-content: space-between; align-items: center; margin-bottom: 4px; }
  h2 { margin: 0; font-size: 16px; color: #a78bfa; }
  .badge { background: rgba(168,85,247,0.2); color: #d8b4fe; border: 1px solid rgba(168,85,247,0.45); padding: 2px 8px; border-radius: 999px; font-size: 10px; font-weight: 700; }
  p.sub { margin: 0 0 8px; font-size: 11px; color: #94a3b8; }
  .add-row { display: flex; gap: 6px; margin-bottom: 8px; }
  input { flex: 1; background: #1e293b; color: #fff; border: 1px solid #334155; border-radius: 6px; padding: 7px 9px; font-size: 11.5px; outline: none; }
  button.primary { background: #8b5cf6; color: #fff; border: none; border-radius: 6px; padding: 7px 11px; font-size: 11px; font-weight: 800; cursor: pointer; }
  .tabs { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; margin-bottom: 8px; }
  .tab { background: #1e293b; color: #cbd5e1; border: 1px solid #334155; border-radius: 6px; padding: 6px; font-size: 11px; font-weight: 700; cursor: pointer; text-align: center; }
  .tab.active { background: #8b5cf6; color: #fff; border-color: #8b5cf6; }
  #logBox { background: #1e293b; border: 1px solid #334155; border-radius: 8px; padding: 8px; height: 170px; overflow-y: auto; font-size: 11px; line-height: 1.45; }
  .entry { padding: 6px; border-bottom: 1px solid #334155; }
  .entry.action { border-left: 3px solid #34d399; padding-left: 8px; background: rgba(16,185,129,0.08); }
  .btns { display: flex; gap: 6px; margin-top: 8px; }
  button.sec { flex: 1; background: #1e293b; color: #e2e8f0; border: 1px solid #334155; border-radius: 6px; padding: 7px; font-size: 11px; font-weight: 700; cursor: pointer; }
</style>
</head>
<body>
  <div class="hdr">
    <h2>🎙️ OtterNotes</h2>
    <span class="badge">Otter.ai Pro Unlocked</span>
  </div>
  <p class="sub">Live Meeting Caption Recorder • Auto Action-Item Extractor • Markdown Minutes</p>

  <div class="add-row">
    <input id="noteInput" type="text" placeholder="Add timestamped note or action item (e.g. 'We will ship by Friday')..." />
    <button class="primary" id="addNoteBtn">+ Log</button>
  </div>

  <div class="tabs">
    <button class="tab active" data-filter="all">📝 Full Transcript</button>
    <button class="tab" data-filter="actions">⚡ Action Items Only</button>
  </div>

  <div id="logBox">Loading meeting transcript…</div>

  <div class="btns">
    <button class="primary" id="recordTabBtn" style="flex:1.3;">🔴 Capture Page Captions</button>
    <button class="sec" id="exportMdBtn">📋 Copy Minutes (.MD)</button>
    <button class="sec" id="clearBtn">🗑️ Clear</button>
  </div>

  <div id="tm-subtle-donate" style="margin-top:8px;text-align:right;">
    <a href="https://paypal.me/influenzian" target="_blank" rel="noopener" style="display:inline-block;padding:3px 9px;border-radius:6px;background:rgba(30,41,59,0.7);border:1px solid rgba(148,163,184,0.2);color:#94a3b8;font-size:10.5px;font-weight:600;text-decoration:none;">Donate</a>
  </div>

  <script src="popup.js"></script>
</body>
</html>
