<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>RockReach — Executive Social Graph Mapper & Email Confidence Scorer</title>
<style>
  * { box-sizing: border-box; }
  body { width: 405px; margin: 0; padding: 14px; background: #0f172a; color: #f8fafc; font-family: system-ui, -apple-system, sans-serif; }
  .hdr { display: flex; justify-content: space-between; align-items: center; margin-bottom: 4px; }
  h2 { margin: 0; font-size: 16px; color: #f87171; }
  .badge { background: rgba(239,68,68,0.2); color: #fca5a5; border: 1px solid rgba(239,68,68,0.45); padding: 2px 8px; border-radius: 999px; font-size: 10px; font-weight: 700; }
  p.sub { margin: 0 0 8px; font-size: 11px; color: #94a3b8; }
  .lbl { font-size: 10px; font-weight: 800; color: #94a3b8; margin: 6px 0 4px; }
  .box { background: #1e293b; border: 1px solid #334155; border-radius: 8px; padding: 8px; font-size: 11px; line-height: 1.45; margin-bottom: 6px; max-height: 85px; overflow-y: auto; }
  .btns { display: flex; gap: 6px; margin-top: 6px; }
  button.primary { flex: 1.3; background: #ef4444; color: #fff; border: none; border-radius: 6px; padding: 8px; font-size: 11px; font-weight: 800; cursor: pointer; }
  button.sec { flex: 1; background: #1e293b; color: #e2e8f0; border: 1px solid #334155; border-radius: 6px; padding: 8px; font-size: 11px; font-weight: 700; cursor: pointer; }
</style>
</head>
<body>
  <div class="hdr">
    <h2>🛰️ RockReach</h2>
    <span class="badge">RocketReach Pro Unlocked</span>
  </div>
  <p class="sub">Executive Social Graph Mapper • Email Permutator • CRM CSV Export</p>

  <div class="lbl">EMAIL SYNTAX CONFIDENCE RANKING</div>
  <div class="box" id="patternsBox"></div>

  <div class="lbl">CROSS-PLATFORM SOCIAL GRAPH (LINKEDIN / GITHUB / X)</div>
  <div class="box" id="profilesBox" style="color:#a78bfa;white-space:pre-wrap;"></div>

  <div class="lbl">PERSONALIZED 1-LINE COLD ICEBREAKER</div>
  <div class="box" id="icebreakerBox" style="color:#34d399;"></div>

  <div class="btns">
    <button class="primary" id="copyIcebreakerBtn">📋 Copy Email + Icebreaker</button>
    <button class="sec" id="saveLeadBtn">+ Save CRM</button>
    <button class="sec" id="exportCsvBtn">⬇️ CSV</button>
  </div>

  <div id="tm-subtle-donate" style="margin-top:8px;text-align:right;">
    <a href="https://paypal.me/influenzian" target="_blank" rel="noopener" style="display:inline-block;padding:3px 9px;border-radius:6px;background:rgba(30,41,59,0.7);border:1px solid rgba(148,163,184,0.2);color:#94a3b8;font-size:10.5px;font-weight:600;text-decoration:none;">Donate</a>
  </div>

  <script src="popup.js"></script>
</body>
</html>
