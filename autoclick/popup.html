<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>AutoClick — Synthetic QA Form Filler & CSS Auto-Clicker</title>
  <style>
    body {
      margin: 0;
      padding: 14px;
      width: 380px;
      background: #0f172a;
      color: #f8fafc;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      font-size: 12px;
    }
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
      padding-bottom: 8px;
      border-bottom: 1px solid #334155;
    }
    .title {
      font-size: 14px;
      font-weight: 700;
      color: #fbbf24;
    }
    .card {
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 8px;
      padding: 10px;
      margin-bottom: 10px;
    }
    input, select {
      width: 100%;
      box-sizing: border-box;
      background: #0f172a;
      color: #f8fafc;
      border: 1px solid #334155;
      border-radius: 6px;
      padding: 6px 8px;
      font-size: 12px;
      margin-bottom: 8px;
    }
    button {
      width: 100%;
      background: #d97706;
      color: #fff;
      border: none;
      border-radius: 6px;
      padding: 8px 10px;
      font-weight: 600;
      cursor: pointer;
    }
    button.secondary {
      background: #334155;
      margin-top: 6px;
    }
  </style>
</head>
<body>
  <div class="header">
    <div>
      <div class="title">⚡ AutoClick &amp; QA Filler</div>
      <div style="font-size:11px;color:#94a3b8;">1-Click Synthetic Form Filler &amp; Interval Clicker</div>
    </div>
    <span id="statusBadge" style="background:#78350f;color:#fef3c7;padding:3px 8px;border-radius:999px;font-weight:700;">Ready</span>
  </div>

  <div class="card">
    <div style="font-weight:600;margin-bottom:6px;color:#fde68a;">Synthetic QA Form Data Filler</div>
    <button id="fillFormsBtn">⚡ 1-Click Fill All Page Form Inputs</button>
  </div>

  <div class="card">
    <div style="font-weight:600;margin-bottom:6px;color:#fde68a;">CSS Selector Auto-Clicker &amp; Auto-Refresh</div>
    <input type="text" id="selectorInput" value="#qa-action-btn" placeholder="Target CSS Selector (e.g. #submit-btn)">
    <select id="intervalSelect">
      <option value="100">Interval: 100 ms (Rapid QA)</option>
      <option value="500" selected>Interval: 500 ms (Standard)</option>
      <option value="1000">Interval: 1,000 ms (1 sec)</option>
      <option value="5000">Interval: 5,000 ms (5 sec)</option>
      <option value="10000">Interval: 10,000 ms (10 sec)</option>
    </select>
    <button id="toggleClickBtn">▶ Start / Stop CSS Auto-Clicker</button>
    <button class="secondary" id="saveRefreshBtn">🔄 Save Tab Auto-Refresh Timer (30s)</button>
    <div id="statusMsg" style="font-size:11px;color:#4ade80;min-height:14px;margin-top:6px;"></div>
  </div>

  <div id="tm-subtle-donate" style="margin-top:8px;text-align:right;">
    <a href="https://www.paypal.com/cgi-bin/webscr?cmd=_donations&business=nagaraj957%40gmail.com&item_name=Support+Free+Open+Extensions&currency_code=USD" target="_blank" rel="noopener" style="display:inline-block;padding:3px 9px;border-radius:6px;background:rgba(30,41,59,0.7);border:1px solid rgba(148,163,184,0.2);color:#94a3b8;font-size:10.5px;font-weight:600;text-decoration:none;">Donate</a>
  </div>

  <script src="popup.js"></script>
</body>
</html>
