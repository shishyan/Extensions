<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>TokTrend — Short-Form Engagement Calculator & Viral Hook Studio</title>
<style>
  * { box-sizing: border-box; }
  body { width: 400px; margin: 0; padding: 14px; background: #0f172a; color: #f8fafc; font-family: system-ui, -apple-system, sans-serif; }
  .hdr { display: flex; justify-content: space-between; align-items: center; margin-bottom: 4px; }
  h2 { margin: 0; font-size: 16px; color: #22d3ee; }
  .badge { background: rgba(244,63,94,0.2); color: #fda4af; border: 1px solid rgba(244,63,94,0.45); padding: 2px 8px; border-radius: 999px; font-size: 10px; font-weight: 700; }
  p.sub { margin: 0 0 8px; font-size: 11px; color: #94a3b8; }
  .grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; margin-bottom: 8px; }
  .stat { background: #1e293b; border: 1px solid #334155; border-radius: 6px; padding: 6px; text-align: center; }
  .stat label { display: block; font-size: 9.5px; color: #94a3b8; }
  .stat input { width: 100%; background: transparent; border: none; color: #fff; font-weight: 800; font-size: 11.5px; text-align: center; outline: none; }
  #erBanner { background: linear-gradient(135deg, #1e293b, #0f172a); border: 1px solid #22d3ee; border-radius: 8px; padding: 8px 10px; font-size: 12px; font-weight: 800; color: #67e8f9; margin-bottom: 8px; display: flex; justify-content: space-between; }
  .hook-row { display: flex; gap: 6px; margin-bottom: 8px; }
  .hook-row input { flex: 1; background: #1e293b; color: #fff; border: 1px solid #334155; border-radius: 6px; padding: 7px 9px; font-size: 11.5px; }
  button.primary { background: #f43f5e; color: #fff; border: none; border-radius: 6px; padding: 7px 11px; font-size: 11px; font-weight: 800; cursor: pointer; }
  #hooksBox { background: #1e293b; border: 1px solid #334155; border-radius: 8px; padding: 8px; font-size: 11px; line-height: 1.45; white-space: pre-wrap; color: #e2e8f0; }
</style>
</head>
<body>
  <div class="hdr">
    <h2>📈 TokTrend</h2>
    <span class="badge">Exolyt + Pentos Unlocked</span>
  </div>
  <p class="sub">Short-Form Video Engagement Calculator • Viral Velocity • 3-Sec Hook Studio</p>

  <div class="grid">
    <div class="stat"><label>VIEWS</label><input id="vIn" type="number" value="125000" /></div>
    <div class="stat"><label>LIKES</label><input id="lIn" type="number" value="11400" /></div>
    <div class="stat"><label>COMMENTS</label><input id="cIn" type="number" value="840" /></div>
    <div class="stat"><label>SHARES</label><input id="sIn" type="number" value="1620" /></div>
  </div>

  <div id="erBanner">
    <span>Engagement Rate: <strong id="erVal">11.09%</strong></span>
    <span id="erTier" style="color:#fda4af;">🔥 S-Tier Viral</span>
  </div>

  <div class="hook-row">
    <input id="topicIn" type="text" value="AI Automation & Productivity" placeholder="Enter video topic for 3-sec hooks..." />
    <button class="primary" id="genHooksBtn">⚡ 3-Sec Hooks</button>
  </div>

  <div id="hooksBox">Generating high-retention 3-second viral hooks…</div>
  
  <div id="tm-subtle-donate" style="margin-top:10px;padding-top:7px;border-top:1px solid rgba(148,163,184,0.12);text-align:center;font-size:10.5px;color:#64748b;">
    100% Free Forever · <a href="https://influenzian-group.gitlab.io/Extensions/donate.html" target="_blank" rel="noopener" style="color:#94a3b8;text-decoration:none;">☕ Support Free Open Tools (Optional)</a>
  </div>

  <script src="popup.js"></script>
</body>
</html>
