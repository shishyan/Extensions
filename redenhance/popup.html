<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>RedEnhance — High-Signal Forum Filter, Link/Code Finder & Thread Exporter</title>
<style>
  * { box-sizing: border-box; }
  body { width: 400px; margin: 0; padding: 14px; background: #0f172a; color: #f8fafc; font-family: system-ui, -apple-system, sans-serif; }
  .hdr { display: flex; justify-content: space-between; align-items: center; margin-bottom: 4px; }
  h2 { margin: 0; font-size: 16px; color: #f87171; }
  .badge { background: rgba(239,68,68,0.2); color: #fca5a5; border: 1px solid rgba(239,68,68,0.45); padding: 2px 8px; border-radius: 999px; font-size: 10px; font-weight: 700; }
  p.sub { margin: 0 0 8px; font-size: 11px; color: #94a3b8; }
  .filters { display: grid; grid-template-columns: repeat(4, 1fr); gap: 5px; margin-bottom: 8px; }
  .f-btn { background: #1e293b; color: #cbd5e1; border: 1px solid #334155; border-radius: 6px; padding: 6px 4px; font-size: 10.5px; font-weight: 700; cursor: pointer; text-align: center; }
  .f-btn.active { background: #ef4444; color: #fff; border-color: #ef4444; }
  #threadBox { background: #1e293b; border: 1px solid #334155; border-radius: 8px; padding: 8px; height: 180px; overflow-y: auto; font-size: 11px; line-height: 1.45; white-space: pre-wrap; }
  button.export { width: 100%; margin-top: 8px; background: #ef4444; color: #fff; border: none; border-radius: 6px; padding: 8px; font-size: 11.5px; font-weight: 800; cursor: pointer; }
</style>
</head>
<body>
  <div class="hdr">
    <h2>🛡️ RedEnhance</h2>
    <span class="badge">RES Pro Unlocked</span>
  </div>
  <p class="sub">High-Signal Discussion Filter • Link & Code Comment Finder • MD Export</p>

  <div class="filters">
    <button class="f-btn active" data-f="signal">🎯 High-Signal</button>
    <button class="f-btn" data-f="links">🔗 Links Only</button>
    <button class="f-btn" data-f="code">💻 Code Only</button>
    <button class="f-btn" data-f="all">📋 All</button>
  </div>

  <div id="threadBox">Scanning discussion thread for high-signal insights…</div>

  <button class="export" id="exportMdBtn">📋 Copy Filtered Thread as Markdown</button>
  
  <div id="tm-subtle-donate" style="margin-top:10px;padding-top:7px;border-top:1px solid rgba(148,163,184,0.12);text-align:center;font-size:10.5px;color:#64748b;">
    100% Free Forever · <a href="https://influenzian-group.gitlab.io/Extensions/donate.html" target="_blank" rel="noopener" style="color:#94a3b8;text-decoration:none;">☕ Support Free Open Tools (Optional)</a>
  </div>

  <script src="popup.js"></script>
</body>
</html>
