<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>KamiPDF Annotator & PDF Scanner</title>
  <style>
    body {
      width: 370px;
      margin: 0;
      padding: 14px;
      background: #451a03;
      color: #fef3c7;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      font-size: 12px;
    }
    h2 {
      margin: 0 0 8px;
      font-size: 15px;
      color: #fbbf24;
    }
    .row {
      display: flex;
      gap: 6px;
      margin-bottom: 8px;
    }
    input {
      flex: 1;
      background: #291002;
      border: 1px solid #d97706;
      color: #fff;
      border-radius: 6px;
      padding: 6px 8px;
      font-size: 11px;
    }
    button {
      background: #f59e0b;
      color: #451a03;
      border: none;
      border-radius: 6px;
      padding: 6px 10px;
      font-size: 11px;
      font-weight: 700;
      cursor: pointer;
    }
    pre {
      background: #291002;
      border: 1px solid #b45309;
      border-radius: 6px;
      padding: 8px;
      font-size: 10px;
      max-height: 170px;
      overflow: auto;
      color: #fde68a;
      white-space: pre-wrap;
      margin: 0;
    }
  </style>
</head>
<body>
  <h2>🖍️ KamiPDF — Annotator & PDF Scanner</h2>
  <div class="row">
    <input id="kp-note" placeholder="Sticky callout text..." value="Important methodology section" />
    <button id="kp-add-note">+Sticky</button>
  </div>
  <div class="row">
    <button id="kp-hl" style="flex:1">🖍️ Highlight Lead Paragraph</button>
    <button id="kp-scan" style="flex:1;background:#d97706;color:#fff">🔍 Scan Page PDFs</button>
  </div>
  <pre id="kp-output">Scanning active page for PDFs & annotations...</pre>
  <script src="popup.js"></script>
</body>
</html>
