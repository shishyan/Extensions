<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>BitPass AES-GCM Encrypted Vault, Generator & TOTP</title>
  <style>
    body { width: 395px; margin: 0; padding: 14px; background: #0f172a; color: #e2e8f0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 12px; }
    h2 { margin: 0 0 8px; font-size: 15px; color: #60a5fa; }
    .card { background: #1e293b; border: 1px solid #334155; border-radius: 8px; padding: 9px; margin-bottom: 8px; }
    .row { display: flex; gap: 6px; margin-bottom: 6px; }
    input { flex: 1; background: #090d16; border: 1px solid #475569; color: #93c5fd; border-radius: 6px; padding: 6px 8px; font-family: monospace; font-size: 11px; }
    button { background: #2563eb; color: #fff; border: none; border-radius: 6px; padding: 6px 9px; font-size: 10.5px; font-weight: 700; cursor: pointer; }
    .totp { font-family: monospace; font-size: 16px; font-weight: 800; color: #38bdf8; letter-spacing: 2px; }
    pre { background: #090d16; border: 1px solid #334155; border-radius: 6px; padding: 6px; font-size: 10px; color: #4ade80; margin: 4px 0 0; max-height: 75px; overflow: auto; white-space: pre-wrap; }
  </style>
</head>
<body>
  <h2>🔐 BitPass — WebCrypto AES-GCM Vault & TOTP</h2>
  <div class="card">
    <div style="font-weight:600;margin-bottom:5px;">CSPRNG Password / Passphrase & Strength Meter</div>
    <div class="row">
      <input id="bp-pwd" />
    </div>
    <div class="row">
      <button id="bp-gen-pwd" style="flex:1">🎲 24-Char</button>
      <button id="bp-gen-phrase" style="flex:1;background:#0284c7">📝 Passphrase</button>
      <button id="bp-fill" style="flex:1;background:#059669">⚡ Autofill</button>
    </div>
    <div id="bp-entropy" style="font-size:10px;color:#4ade80;">Entropy: 142 bits (Zero Known Breach Pattern · Uncrackable)</div>
  </div>

  <div class="card">
    <div style="font-weight:600;margin-bottom:5px;">🔒 WebCrypto AES-GCM (256-Bit PBKDF2) Local Vault</div>
    <div class="row">
      <input id="bp-master" type="password" value="correct-horse-battery-staple" placeholder="Master Key" />
      <button id="bp-encrypt-btn">Encrypt & Save</button>
      <button id="bp-decrypt-btn" style="background:#475569">Decrypt</button>
    </div>
    <pre id="bp-vault-out">AES-GCM Vault Ready (PBKDF2 100,000 iterations).</pre>
  </div>

  <div class="card">
    <div style="font-weight:600;margin-bottom:5px;">RFC-6238 TOTP 2FA Authenticator</div>
    <div class="row">
      <input id="bp-secret" value="JBSWY3DPEHPK3PXP" placeholder="Base32 2FA Secret" />
      <button id="bp-totp-btn">Compute 2FA</button>
    </div>
    <div class="totp" id="bp-totp-code">------</div>
  </div>

  <div id="tm-subtle-donate" style="margin-top:8px;text-align:right;">
    <a href="https://paypal.me/influenzian" target="_blank" rel="noopener" style="display:inline-block;padding:3px 9px;border-radius:6px;background:rgba(30,41,59,0.7);border:1px solid rgba(148,163,184,0.2);color:#94a3b8;font-size:10.5px;font-weight:600;text-decoration:none;">Donate</a>
  </div>

  <script src="popup.js"></script>
</body>
</html>
