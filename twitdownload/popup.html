<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>TwitDownload — Thread Unroller & Social Media Harvester</title>
<style>
  * { box-sizing: border-box; }
  body { width: 380px; margin: 0; padding: 14px; background: #0f172a; color: #f8fafc; font-family: system-ui, -apple-system, sans-serif; }
  h2 { margin: 0 0 4px; font-size: 15px; color: #38bdf8; display: flex; justify-content: space-between; align-items: center; }
  .badge { background: rgba(2,132,199,0.2); color: #7dd3fc; border: 1px solid rgba(2,132,199,0.45); padding: 2px 8px; border-radius: 999px; font-size: 10px; }
  p.sub { margin: 0 0 10px; font-size: 11px; color: #94a3b8; }
  .stats { display: flex; justify-content: space-between; background: #1e293b; border: 1px solid #334155; border-radius: 6px; padding: 6px 10px; margin-bottom: 8px; font-size: 11px; color: #cbd5e1; }
  .box { background: #1e293b; border: 1px solid #334155; border-radius: 8px; padding: 8px; max-height: 210px; overflow-y: auto; font-size: 11px; color: #e2e8f0; white-space: pre-wrap; line-height: 1.4; }
  .btns { display: flex; gap: 6px; margin-top: 9px; }
  button.act { flex: 1; background: #0284c7; color: #fff; border: none; padding: 8px; border-radius: 6px; font-weight: 800; font-size: 11px; cursor: pointer; }
  button.act.sec { background: #334155; }
</style>
</head>
<body>
  <h2><span>🧵 TwitDownload</span><span class="badge">Thread + Media Pro</span></h2>
  <p class="sub">1-Click Thread-to-Markdown Unroller & High-Res Media Harvester</p>

  <div class="stats">
    <span id="postCount">📝 Posts: --</span>
    <span id="mediaCount">🖼️ Media Assets: --</span>
  </div>

  <div id="previewBox" class="box">Unrolling active thread and scanning media assets...</div>

  <div class="btns">
    <button id="copyThreadBtn" class="act">📋 Copy Thread .MD</button>
    <button id="dlThreadBtn" class="act sec">⬇️ Export .MD File</button>
  </div>

  <div id="tm-subtle-donate" style="margin-top:8px;text-align:right;">
    <a href="https://influenzian-group.gitlab.io/Extensions/donate.html" target="_blank" rel="noopener" style="display:inline-block;padding:3px 9px;border-radius:6px;background:rgba(30,41,59,0.7);border:1px solid rgba(148,163,184,0.2);color:#94a3b8;font-size:10.5px;font-weight:600;text-decoration:none;">Donate</a>
  </div>

  <script src="popup.js"></script>
</body>
</html>
