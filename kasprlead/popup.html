<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>KasprLead — Profile Contact Enricher & 300-Char Connection Composer</title>
<style>
  * { box-sizing: border-box; }
  body { width: 400px; margin: 0; padding: 14px; background: #0f172a; color: #f8fafc; font-family: system-ui, -apple-system, sans-serif; }
  .hdr { display: flex; justify-content: space-between; align-items: center; margin-bottom: 4px; }
  h2 { margin: 0; font-size: 16px; color: #e879f9; }
  .badge { background: rgba(168,85,247,0.2); color: #f0abfc; border: 1px solid rgba(168,85,247,0.45); padding: 2px 8px; border-radius: 999px; font-size: 10px; font-weight: 700; }
  p.sub { margin: 0 0 8px; font-size: 11px; color: #94a3b8; }
  .lbl { font-size: 10px; font-weight: 800; color: #94a3b8; margin: 6px 0 4px; display: flex; justify-content: space-between; }
  textarea { width: 100%; height: 95px; border-radius: 8px; border: 1px solid #a855f7; background: #1e293b; color: #fff; padding: 8px; font-size: 11.5px; resize: vertical; outline: none; line-height: 1.45; }
  .btns { display: flex; gap: 6px; margin-top: 8px; }
  button.primary { flex: 1.4; background: #a855f7; color: #fff; border: none; border-radius: 6px; padding: 8px; font-size: 11px; font-weight: 800; cursor: pointer; }
  button.sec { flex: 1; background: #1e293b; color: #e2e8f0; border: 1px solid #334155; border-radius: 6px; padding: 8px; font-size: 11px; font-weight: 700; cursor: pointer; }
</style>
</head>
<body>
  <div class="hdr">
    <h2>👻 KasprLead</h2>
    <span class="badge">Kaspr Pro Unlocked</span>
  </div>
  <p class="sub">Profile Contact Enricher & 300-Character LinkedIn Connection Note Guard</p>

  <div class="lbl">
    <span>PERSONALIZED CONNECTION INVITE</span>
    <span id="charCounter" style="color:#34d399;">186 / 300 chars</span>
  </div>

  <textarea id="noteBox" maxlength="300">Hi Alex, loved your insights on enterprise AI & cloud automation! We're building high-velocity engineering workflows in the same space — would love to connect and exchange notes.</textarea>

  <div class="btns">
    <button class="primary" id="copyNoteBtn">📋 Copy 300-Char Invite</button>
    <button class="sec" id="exportJsonBtn">⬇️ Enriched JSON</button>
  </div>
  
  <div id="tm-subtle-donate" style="margin-top:10px;padding-top:7px;border-top:1px solid rgba(148,163,184,0.12);text-align:center;font-size:10.5px;color:#64748b;">
    100% Free Forever · <a href="https://influenzian-group.gitlab.io/Extensions/donate.html" target="_blank" rel="noopener" style="color:#94a3b8;text-decoration:none;">☕ Support Free Open Tools (Optional)</a>
  </div>

  <script src="popup.js"></script>
</body>
</html>
