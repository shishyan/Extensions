<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>SponsorBlock — Auto-Skip Sponsors & De-Clickbait Titles</title>
<style>
  * { box-sizing: border-box; }
  body { width: 375px; margin: 0; padding: 14px; background: #0f172a; color: #f8fafc; font-family: system-ui, -apple-system, sans-serif; }
  h2 { margin: 0 0 4px; font-size: 15px; color: #86efac; display: flex; justify-content: space-between; align-items: center; }
  .badge { background: rgba(34,197,94,0.2); color: #bbf7d0; border: 1px solid rgba(34,197,94,0.45); padding: 2px 8px; border-radius: 999px; font-size: 10px; }
  p.sub { margin: 0 0 10px; font-size: 11px; color: #94a3b8; }
  .card { background: #1e293b; border: 1px solid #334155; border-radius: 8px; padding: 10px; margin-bottom: 8px; font-size: 12px; }
  .row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; }
  .btns { display: flex; gap: 6px; margin-top: 8px; }
  button.act { flex: 1; background: #16a34a; color: #fff; border: none; padding: 8px; border-radius: 6px; font-weight: 800; font-size: 11px; cursor: pointer; }
  button.act.sec { background: #334155; }
</style>
</head>
<body>
  <h2><span>⏭ SponsorBlock</span><span class="badge">SponsorBlock + DeArrow</span></h2>
  <p class="sub">Auto-Skip Sponsor/Intro Segments & Clickbait Title Normalizer</p>

  <div class="card">
    <div class="row"><span>⏱️ Total Time Saved:</span><strong id="savedTxt" style="color:#86efac;">2m 25s</strong></div>
    <div class="row"><span>🛡️ Auto-Skip Sponsors & Intros:</span><strong>ACTIVE</strong></div>
    <div class="row" style="margin-bottom:0;"><span>🧹 DeArrow Clickbait Normalizer:</span><strong>READY</strong></div>
  </div>

  <div class="btns">
    <button id="skipBtn" class="act">⏭ Skip Segment (+15s)</button>
    <button id="cleanBtn" class="act sec">🧹 De-Clickbait Page</button>
  </div>
  <script src="popup.js"></script>
</body>
</html>
