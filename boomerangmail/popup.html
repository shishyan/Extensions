<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>BoomerangMail — Respondable AI Scorer, Send-Later & Follow-Up Injector</title>
<style>
  * { box-sizing: border-box; }
  body { width: 395px; margin: 0; padding: 14px; background: #0f172a; color: #f8fafc; font-family: system-ui, -apple-system, sans-serif; }
  h2 { margin: 0 0 4px; font-size: 15px; color: #fca5a5; display: flex; justify-content: space-between; align-items: center; }
  .badge { background: rgba(220,38,38,0.2); color: #fecaca; border: 1px solid rgba(220,38,38,0.45); padding: 2px 8px; border-radius: 999px; font-size: 10px; }
  p.sub { margin: 0 0 8px; font-size: 11px; color: #94a3b8; }
  textarea { width: 100%; height: 68px; background: #1e293b; color: #f8fafc; border: 1px solid #334155; border-radius: 6px; padding: 7px 8px; font-size: 11px; resize: none; margin-bottom: 8px; }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; margin-bottom: 8px; }
  .box { background: #1e293b; border: 1px solid #334155; border-radius: 8px; padding: 7px; text-align: center; }
  .lbl { font-size: 10px; color: #94a3b8; }
  .val { font-size: 13px; font-weight: 800; color: #4ade80; margin-top: 2px; }
  .btns { display: flex; gap: 6px; margin-bottom: 6px; }
  button.act { flex: 1; background: #dc2626; color: #fff; border: none; padding: 8px; border-radius: 6px; font-weight: 800; font-size: 11px; cursor: pointer; }
  button.sec { flex: 1; background: #334155; color: #fff; border: none; padding: 8px; border-radius: 6px; font-weight: 700; font-size: 11px; cursor: pointer; }
</style>
</head>
<body>
  <h2><span>🪃 BoomerangMail</span><span class="badge">Respondable Pro Free</span></h2>
  <p class="sub">Politeness & Reply-Likelihood Scorer, Send-Later Scheduler & Template Injector</p>

  <textarea id="draftInput">Hi Alex, thank you for sharing the Q4 architecture brief! Would Thursday at 10:00 AM EST work for a 15-minute review call?</textarea>

  <div class="grid">
    <div class="box"><div class="lbl">Reply Likelihood</div><div class="val" id="likeVal">94%</div></div>
    <div class="box"><div class="lbl">Politeness Score</div><div class="val" id="polVal">96/100 (Warm)</div></div>
    <div class="box"><div class="lbl">Reading Ease</div><div class="val" id="rVal">Grade 6</div></div>
    <div class="box"><div class="lbl">Optimal Send Slot</div><div class="val" id="sVal" style="font-size:11px;color:#fca5a5;">Tue 09:00 AM</div></div>
  </div>

  <div class="btns">
    <button id="injectBtn" class="act">✍️ Inject Send-Later / Follow-Up</button>
    <button id="schedBtn" class="sec">⏰ Schedule Reminder</button>
  </div>
  <button id="pauseBtn" class="sec" style="width:100%;">⏸️ Toggle Distraction-Free Inbox Pause</button>

  <div id="tm-subtle-donate" style="margin-top:8px;text-align:right;">
    <a href="https://paypal.me/influenzian" target="_blank" rel="noopener" style="display:inline-block;padding:3px 9px;border-radius:6px;background:rgba(30,41,59,0.7);border:1px solid rgba(148,163,184,0.2);color:#94a3b8;font-size:10.5px;font-weight:600;text-decoration:none;">Donate</a>
  </div>

  <script src="popup.js"></script>
</body>
</html>
