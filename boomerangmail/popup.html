<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>BoomerangMail — Respondable AI Scorer & Send-Later</title>
<style>
  * { box-sizing: border-box; }
  body { width: 380px; margin: 0; padding: 14px; background: #0f172a; color: #f8fafc; font-family: system-ui, -apple-system, sans-serif; }
  h2 { margin: 0 0 4px; font-size: 15px; color: #fca5a5; display: flex; justify-content: space-between; align-items: center; }
  .badge { background: rgba(220,38,38,0.2); color: #fecaca; border: 1px solid rgba(220,38,38,0.45); padding: 2px 8px; border-radius: 999px; font-size: 10px; }
  p.sub { margin: 0 0 10px; font-size: 11px; color: #94a3b8; }
  textarea { width: 100%; height: 68px; background: #1e293b; color: #f8fafc; border: 1px solid #334155; border-radius: 6px; padding: 7px 8px; font-size: 11px; resize: none; margin-bottom: 8px; }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; margin-bottom: 8px; }
  .box { background: #1e293b; border: 1px solid #334155; border-radius: 8px; padding: 7px; text-align: center; }
  .lbl { font-size: 10px; color: #94a3b8; }
  .val { font-size: 14px; font-weight: 800; color: #4ade80; margin-top: 2px; }
  button.act { width: 100%; background: #dc2626; color: #fff; border: none; padding: 8px; border-radius: 6px; font-weight: 800; font-size: 11px; cursor: pointer; }
</style>
</head>
<body>
  <h2><span>🪃 BoomerangMail</span><span class="badge">Respondable Pro Free</span></h2>
  <p class="sub">AI Reply-Likelihood Scorer, Send-Later Optimizer & Inbox Pause</p>

  <textarea id="draftInput">Hi Alex, thank you for sharing the Q4 architecture brief! Would Thursday at 10:00 AM EST work for a 15-minute review call?</textarea>

  <div class="grid">
    <div class="box"><div class="lbl">Reply Likelihood</div><div class="val" id="likeVal">92%</div></div>
    <div class="box"><div class="lbl">Questions Asked</div><div class="val" id="qVal">1 (Optimal)</div></div>
    <div class="box"><div class="lbl">Reading Ease</div><div class="val" id="rVal">Grade 6</div></div>
    <div class="box"><div class="lbl">Optimal Send Slot</div><div class="val" id="sVal" style="font-size:11px;color:#fca5a5;">Tue 09:00 AM</div></div>
  </div>

  <button id="pauseBtn" class="act">⏸️ Toggle Distraction-Free Inbox Pause</button>
  <script src="popup.js"></script>
</body>
</html>
