<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>StylusCSS — Per-Domain UserCSS & Instant Theme Studio</title>
  <style>
    body {
      margin: 0;
      padding: 14px;
      width: 380px;
      background: #0f172a;
      color: #f8fafc;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      font-size: 12px;
    }
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
      padding-bottom: 8px;
      border-bottom: 1px solid #334155;
    }
    .title {
      font-size: 14px;
      font-weight: 700;
      color: #f472b6;
    }
    .card {
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 8px;
      padding: 10px;
      margin-bottom: 10px;
    }
    .preset-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 6px;
      margin-bottom: 8px;
    }
    .preset-btn {
      background: #0f172a;
      color: #fbcfe8;
      border: 1px solid #be185d;
      border-radius: 6px;
      padding: 6px 8px;
      font-size: 11px;
      font-weight: 600;
      cursor: pointer;
    }
    textarea {
      width: 100%;
      box-sizing: border-box;
      height: 95px;
      background: #0f172a;
      color: #f8fafc;
      border: 1px solid #334155;
      border-radius: 6px;
      padding: 8px;
      font-size: 11px;
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      resize: none;
    }
    .btn-row {
      display: flex;
      gap: 6px;
      margin-top: 8px;
    }
    button.primary {
      flex: 1;
      background: #db2777;
      color: #fff;
      border: none;
      border-radius: 6px;
      padding: 7px 10px;
      font-weight: 600;
      cursor: pointer;
    }
    button.secondary {
      background: #334155;
      color: #fff;
      border: none;
      border-radius: 6px;
      padding: 7px 10px;
      font-weight: 600;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div class="header">
    <div>
      <div class="title">🎨 StylusCSS Studio</div>
      <div style="font-size:11px;color:#94a3b8;">Live Per-Domain UserCSS Editor &amp; 4 Instant Themes</div>
    </div>
    <span id="hostBadge" style="background:#831843;color:#fce7f3;padding:3px 8px;border-radius:999px;font-weight:700;">active-tab</span>
  </div>

  <div class="card">
    <div style="font-weight:600;margin-bottom:6px;color:#f9a8d4;">Built-In Instant Themes</div>
    <div class="preset-grid">
      <button class="preset-btn" data-preset="Cozy Reading Mode">📖 Cozy Reading Mode</button>
      <button class="preset-btn" data-preset="Neon Cyberpunk">⚡ Neon Cyberpunk</button>
      <button class="preset-btn" data-preset="Hide Distractions / Sidebars">🧹 Hide Distractions</button>
      <button class="preset-btn" data-preset="Ultra-Wide Fullscreen">🖥️ Ultra-Wide Mode</button>
    </div>

    <div style="font-weight:600;margin-bottom:4px;color:#f9a8d4;">Custom Per-Domain CSS Editor</div>
    <textarea id="cssEditor" placeholder="/* Write custom CSS for this domain */&#10;body { font-smooth: always; }"></textarea>
    <div class="btn-row">
      <button class="primary" id="applyCssBtn">Apply &amp; Save Domain CSS</button>
      <button class="secondary" id="resetCssBtn">Reset</button>
    </div>
    <div id="statusMsg" style="font-size:11px;color:#4ade80;min-height:14px;margin-top:4px;"></div>
  </div>

  <div id="tm-subtle-donate" style="margin-top:8px;text-align:right;">
    <a href="https://www.paypal.com/cgi-bin/webscr?cmd=_donations&business=nagaraj957%40gmail.com&item_name=Support+Free+Open+Extensions&currency_code=USD" target="_blank" rel="noopener" style="display:inline-block;padding:3px 9px;border-radius:6px;background:rgba(30,41,59,0.7);border:1px solid rgba(148,163,184,0.2);color:#94a3b8;font-size:10.5px;font-weight:600;text-decoration:none;">Donate</a>
  </div>

  <script src="popup.js"></script>
</body>
</html>
