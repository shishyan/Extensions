<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>SiderChat — Split-Screen Reading Copilot, Outline & Code/Citation Extractor</title>
<style>
  * { box-sizing: border-box; }
  body { width: 410px; margin: 0; padding: 14px; background: #081426; color: #f8fafc; font-family: system-ui, -apple-system, sans-serif; }
  .hdr { display: flex; justify-content: space-between; align-items: center; margin-bottom: 4px; }
  h2 { margin: 0; font-size: 16px; color: #22d3ee; }
  .badge { background: rgba(6,182,212,0.2); color: #67e8f9; border: 1px solid rgba(6,182,212,0.45); padding: 2px 8px; border-radius: 999px; font-size: 10px; font-weight: 700; }
  p.sub { margin: 0 0 8px; font-size: 11px; color: #94a3b8; }
  input { width: 100%; background: #0f172a; color: #fff; border: 1px solid #1e293b; border-radius: 6px; padding: 7px 9px; font-size: 11.5px; margin-bottom: 8px; outline: none; }
  input:focus { border-color: #06b6d4; }
  .tabs { display: grid; grid-template-columns: repeat(3, 1fr); gap: 5px; margin-bottom: 8px; }
  .tab { background: #0f172a; color: #94a3b8; border: 1px solid #1e293b; border-radius: 6px; padding: 6px 4px; font-size: 11px; font-weight: 700; cursor: pointer; text-align: center; }
  .tab.active { background: #06b6d4; color: #082f49; border-color: #06b6d4; }
  #listContainer { background: #0f172a; border: 1px solid #1e293b; border-radius: 8px; padding: 8px; height: 185px; overflow-y: auto; font-size: 11px; line-height: 1.45; color: #e2e8f0; white-space: pre-wrap; }
  .actions { display: flex; gap: 6px; margin-top: 8px; }
  button.primary { flex: 2; background: #06b6d4; color: #082f49; border: none; padding: 8px; border-radius: 6px; font-weight: 800; font-size: 11.5px; cursor: pointer; }
  button.sec { flex: 1; background: #0f172a; color: #e2e8f0; border: 1px solid #1e293b; padding: 8px; border-radius: 6px; font-weight: 700; font-size: 11px; cursor: pointer; }
</style>
</head>
<body>
  <div class="hdr">
    <h2>📖 SiderChat</h2>
    <span class="badge">Sider AI Pro Unlocked</span>
  </div>
  <p class="sub">Split-Screen Reading Copilot • Interactive Outline • Citations & Code</p>

  <input id="searchFilter" type="text" placeholder="Search or filter headings, statistics, citations, code..." />

  <div class="tabs">
    <button class="tab active" data-tab="outline">📑 Outline</button>
    <button class="tab" data-tab="stats">📊 Stats & Citations</button>
    <button class="tab" data-tab="code">💻 Code Blocks</button>
  </div>

  <div id="listContainer">Analyzing active document structure…</div>

  <div class="actions">
    <button class="primary" id="dockSplitBtn">📐 Toggle Split-Screen Reader</button>
    <button class="sec" id="copyOutlineBtn">📋 Copy MD</button>
  </div>

  <div id="tm-subtle-donate" style="margin-top:8px;text-align:right;">
    <a href="https://influenzian-group.gitlab.io/Extensions/donate.html" target="_blank" rel="noopener" style="display:inline-block;padding:3px 9px;border-radius:6px;background:rgba(30,41,59,0.7);border:1px solid rgba(148,163,184,0.2);color:#94a3b8;font-size:10.5px;font-weight:600;text-decoration:none;">Donate</a>
  </div>

  <script src="popup.js"></script>
</body>
</html>
