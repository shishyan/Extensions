<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>MerlCopilot — Free AI Sidebar & Summarizer</title>
<style>
  * { box-sizing: border-box; }
  body { width: 370px; margin: 0; padding: 14px; background: #0f172a; color: #f8fafc; font-family: system-ui, -apple-system, sans-serif; }
  h2 { margin: 0 0 4px; font-size: 16px; color: #818cf8; display: flex; justify-content: space-between; align-items: center; }
  .badge { background: rgba(99,102,241,0.2); color: #a5b4fc; border: 1px solid rgba(99,102,241,0.4); padding: 2px 8px; border-radius: 999px; font-size: 10px; }
  p.sub { margin: 0 0 10px; font-size: 11px; color: #94a3b8; }
  .meta-bar { display: flex; justify-content: space-between; background: #1e293b; border: 1px solid #334155; border-radius: 6px; padding: 6px 10px; margin-bottom: 8px; font-size: 11px; color: #cbd5e1; }
  .box { background: #1e293b; border: 1px solid #334155; border-radius: 8px; padding: 10px; font-size: 12px; max-height: 230px; overflow-y: auto; }
  .box ul { padding-left: 16px; margin: 0; }
  .box li { margin-bottom: 7px; line-height: 1.45; }
  .btns { display: flex; gap: 6px; margin-top: 10px; }
  button { flex: 1; background: #6366f1; color: #fff; border: none; padding: 8px; border-radius: 6px; font-weight: 700; font-size: 11px; cursor: pointer; }
  button.sec { background: #334155; }
</style>
</head>
<body>
  <h2><span>⚡ MerlCopilot</span><span class="badge">Merlin + MaxAI Unlocked</span></h2>
  <p class="sub">Instant Page TL;DR, Key Takeaways, Reading Time & Markdown Exporter</p>
  <div id="meta" class="meta-bar"><span>📖 Words: --</span><span>⏱️ Read Time: --</span></div>
  <div id="out" class="box">Extracting key takeaways from active tab...</div>
  <div class="btns">
    <button id="copyBtn">📋 Copy Markdown</button>
    <button id="dlBtn" class="sec">⬇️ Export .MD File</button>
  </div>

  <div id="tm-subtle-donate" style="margin-top:8px;text-align:right;">
    <a href="https://www.paypal.com/cgi-bin/webscr?cmd=_donations&business=nagaraj957%40gmail.com&item_name=Support+Free+Open+Extensions&currency_code=USD" target="_blank" rel="noopener" style="display:inline-block;padding:3px 9px;border-radius:6px;background:rgba(30,41,59,0.7);border:1px solid rgba(148,163,184,0.2);color:#94a3b8;font-size:10.5px;font-weight:600;text-decoration:none;">Donate</a>
  </div>

  <script src="popup.js"></script>
</body>
</html>
