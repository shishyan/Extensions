<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>AhrefBacklink — Outbound/Inbound Link & Anchor Text Auditor</title>
<style>
  * { box-sizing: border-box; }
  body { width: 400px; margin: 0; padding: 13px; background: #0f172a; color: #f8fafc; font-family: system-ui, -apple-system, sans-serif; }
  h2 { margin: 0 0 4px; font-size: 15px; color: #fb923c; display: flex; justify-content: space-between; align-items: center; }
  .badge { background: rgba(249,115,22,0.2); color: #fb923c; border: 1px solid rgba(249,115,22,0.4); padding: 2px 8px; border-radius: 999px; font-size: 10px; }
  p.sub { margin: 0 0 8px; font-size: 11px; color: #94a3b8; }
  .grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; margin-bottom: 8px; }
  .box { background: #1e293b; border: 1px solid #334155; border-radius: 8px; padding: 6px; text-align: center; }
  .box .v { font-size: 14px; font-weight: 800; color: #fb923c; }
  .box .k { font-size: 9.5px; color: #94a3b8; }
  .list { background: #1e293b; border: 1px solid #334155; border-radius: 8px; padding: 8px; height: 155px; overflow-y: auto; font-size: 11px; margin-bottom: 8px; }
  .item { padding: 4px 0; border-bottom: 1px solid #334155; display: flex; justify-content: space-between; gap: 6px; }
  .item:last-child { border-bottom: none; }
  .btns { display: flex; gap: 6px; }
  button.act { flex: 1; background: #ea580c; color: #fff; border: none; padding: 8px; border-radius: 6px; font-weight: 700; font-size: 11px; cursor: pointer; }
  button.act.sec { background: #334155; }
</style>
</head>
<body>
  <h2><span>🔗 AhrefBacklink Pro</span><span class="badge">Ahrefs Toolbar Free</span></h2>
  <p class="sub">DR/UR Rating, Anchor Text Breakdown, Dofollow/Nofollow & CSV Export</p>

  <div class="grid">
    <div class="box"><div class="v" id="drVal">--</div><div class="k">Domain Rating</div></div>
    <div class="box"><div class="v" id="extVal">--</div><div class="k">Ext Links</div></div>
    <div class="box"><div class="v" id="dfVal" style="color:#34d399;">--</div><div class="k">Dofollow</div></div>
    <div class="box"><div class="v" id="nfVal" style="color:#f87171;">--</div><div class="k">Nofollow</div></div>
  </div>

  <div class="list" id="linkTable">Scanning all page links & anchor texts...</div>

  <div class="btns">
    <button id="csvBtn" class="act">📥 Export Links CSV</button>
    <button id="mdBtn" class="act sec">📋 Copy Anchor Report</button>
  </div>

  <div id="tm-subtle-donate" style="margin-top:8px;text-align:right;">
    <a href="https://paypal.me/influenzian" target="_blank" rel="noopener" style="display:inline-block;padding:3px 9px;border-radius:6px;background:rgba(30,41,59,0.7);border:1px solid rgba(148,163,184,0.2);color:#94a3b8;font-size:10.5px;font-weight:600;text-decoration:none;">Donate</a>
  </div>

  <script src="popup.js"></script>
</body>
</html>
