<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>WordRewrite — 5-Mode AI Paraphraser & Rewriter</title>
<style>
  * { box-sizing: border-box; }
  body { width: 390px; margin: 0; padding: 14px; background: #0f172a; color: #f8fafc; font-family: system-ui, -apple-system, sans-serif; }
  h2 { margin: 0 0 4px; font-size: 15px; color: #8b5cf6; display: flex; justify-content: space-between; align-items: center; }
  .badge { background: rgba(16,185,129,0.2); color: #34d399; border: 1px solid rgba(16,185,129,0.4); padding: 2px 8px; border-radius: 999px; font-size: 10px; }
  p.sub { margin: 0 0 8px; font-size: 11px; color: #94a3b8; }
  .modes { display: grid; grid-template-columns: repeat(5, 1fr); gap: 4px; margin-bottom: 8px; }
  .modes button { background: #1e293b; color: #cbd5e1; border: 1px solid #334155; border-radius: 6px; padding: 6px 4px; font-size: 10px; font-weight: 700; cursor: pointer; }
  .modes button.active { background: #8b5cf6; color: #fff; border-color: #8b5cf6; }
  textarea { width: 100%; height: 82px; background: #1e293b; color: #f8fafc; border: 1px solid #334155; border-radius: 8px; padding: 8px; font-size: 11.5px; margin-bottom: 6px; font-family: inherit; }
  .meta { display: flex; justify-content: space-between; font-size: 10.5px; color: #94a3b8; margin-bottom: 6px; }
  .btns { display: flex; gap: 6px; }
  button.act { flex: 1; background: #8b5cf6; color: #fff; border: none; padding: 8px; border-radius: 6px; font-weight: 700; font-size: 11px; cursor: pointer; }
  button.act.sec { background: #334155; }
</style>
</head>
<body>
  <h2><span>🪶 WordRewrite Pro</span><span class="badge">Unlimited Words</span></h2>
  <p class="sub">5 Pro Modes: Fluency, Formal, Concise, Expand & Executive Bullets</p>

  <div class="modes" id="modeBar">
    <button data-mode="fluency" class="active">Fluency</button>
    <button data-mode="formal">Formal</button>
    <button data-mode="concise">Concise</button>
    <button data-mode="expand">Expand</button>
    <button data-mode="bullet">Bullets</button>
  </div>

  <textarea id="srcText" placeholder="Paste or pull selected text from page...">In order to make sure our team can get fast results, we need to help users fix important problems due to the fact that speed matters.</textarea>
  <textarea id="outText" readonly placeholder="Paraphrased output appears here..."></textarea>

  <div class="meta">
    <span id="wordDelta">Words: 0 → 0</span>
    <span id="modeLabel">Mode: Fluency</span>
  </div>

  <div class="btns">
    <button id="runBtn" class="act">✨ Rewrite Now</button>
    <button id="pullBtn" class="act sec">📥 Pull Selection</button>
    <button id="replaceBtn" class="act sec">📤 Replace on Page</button>
    <button id="copyBtn" class="act sec">📋 Copy</button>
  </div>

  <div id="tm-subtle-donate" style="margin-top:8px;text-align:right;">
    <a href="https://paypal.me/influenzian" target="_blank" rel="noopener" style="display:inline-block;padding:3px 9px;border-radius:6px;background:rgba(30,41,59,0.7);border:1px solid rgba(148,163,184,0.2);color:#94a3b8;font-size:10.5px;font-weight:600;text-decoration:none;">Donate</a>
  </div>

  <script src="popup.js"></script>
</body>
</html>
