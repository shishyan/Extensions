<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>ZoteroCite — Academic Citation Studio</title>
  <style>
    body {
      margin: 0;
      padding: 14px;
      width: 380px;
      background: #0f172a;
      color: #f8fafc;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      font-size: 12px;
    }
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 10px;
      padding-bottom: 8px;
      border-bottom: 1px solid #334155;
    }
    .title {
      font-size: 14px;
      font-weight: 700;
      color: #f87171;
    }
    .sub {
      font-size: 11px;
      color: #94a3b8;
    }
    .card {
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 8px;
      padding: 10px;
      margin-bottom: 10px;
    }
    .meta-row {
      display: flex;
      justify-content: space-between;
      margin-bottom: 4px;
      color: #cbd5e1;
    }
    .style-tabs {
      display: flex;
      gap: 4px;
      margin-bottom: 8px;
      flex-wrap: wrap;
    }
    .style-tab {
      background: #0f172a;
      color: #cbd5e1;
      border: 1px solid #334155;
      border-radius: 6px;
      padding: 4px 8px;
      font-size: 11px;
      cursor: pointer;
    }
    .style-tab.active {
      background: #dc2626;
      color: #fff;
      border-color: #ef4444;
      font-weight: 600;
    }
    textarea {
      width: 100%;
      box-sizing: border-box;
      height: 68px;
      background: #0f172a;
      color: #f8fafc;
      border: 1px solid #334155;
      border-radius: 6px;
      padding: 8px;
      font-size: 11px;
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      resize: none;
    }
    .actions {
      display: flex;
      gap: 6px;
      margin-top: 8px;
    }
    button.primary {
      flex: 1;
      background: #dc2626;
      color: #fff;
      border: none;
      border-radius: 6px;
      padding: 7px 10px;
      font-weight: 600;
      cursor: pointer;
    }
    button.secondary {
      background: #334155;
      color: #f8fafc;
      border: none;
      border-radius: 6px;
      padding: 7px 10px;
      font-weight: 600;
      cursor: pointer;
    }
    .status {
      font-size: 11px;
      color: #4ade80;
      min-height: 15px;
      margin-top: 4px;
    }
  </style>
</head>
<body>
  <div class="header">
    <div>
      <div class="title">📚 ZoteroCite</div>
      <div class="sub">5-Style Citation Generator + BibTeX / RIS Exporter</div>
    </div>
    <span id="yearBadge" style="background:#7f1d1d;color:#fecaca;padding:3px 8px;border-radius:999px;font-weight:700;">2026</span>
  </div>

  <div class="card">
    <div class="meta-row"><strong>Author:</strong> <span id="metaAuthor">Editorial Research Team</span></div>
    <div class="meta-row"><strong>Source:</strong> <span id="metaSite">Journal of Web Systems</span></div>
    <div class="meta-row"><strong>Title:</strong> <span id="metaTitle" style="max-width:240px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">Research Article</span></div>
  </div>

  <div class="card">
    <div class="style-tabs" id="styleTabs">
      <button class="style-tab active" data-style="APA 7th">APA 7th</button>
      <button class="style-tab" data-style="MLA 9th">MLA 9th</button>
      <button class="style-tab" data-style="Chicago 17th">Chicago 17th</button>
      <button class="style-tab" data-style="IEEE">IEEE</button>
      <button class="style-tab" data-style="Harvard">Harvard</button>
    </div>
    <textarea id="citationOutput" readonly></textarea>
    <div class="actions">
      <button class="primary" id="copyStyleBtn">Copy Formatted Citation</button>
      <button class="secondary" id="copyBibtexBtn">Copy .bib</button>
      <button class="secondary" id="copyRisBtn">Copy .ris</button>
    </div>
    <div class="status" id="statusMsg"></div>
  </div>

  <div class="card">
    <div style="font-weight:600;margin-bottom:6px;color:#fca5a5;">BibTeX / RIS Export Preview</div>
    <textarea id="exportOutput" readonly></textarea>
  </div>

  <div id="tm-subtle-donate" style="margin-top:8px;text-align:right;">
    <a href="https://influenzian-group.gitlab.io/Extensions/donate.html" target="_blank" rel="noopener" style="display:inline-block;padding:3px 9px;border-radius:6px;background:rgba(30,41,59,0.7);border:1px solid rgba(148,163,184,0.2);color:#94a3b8;font-size:10.5px;font-weight:600;text-decoration:none;">Donate</a>
  </div>

  <script src="popup.js"></script>
</body>
</html>
