<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>PrintClean — Element Zapper & Clean PDF Engine</title>
  <style>
    body {
      margin: 0;
      padding: 14px;
      width: 380px;
      background: #0f172a;
      color: #f8fafc;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      font-size: 12px;
    }
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
      padding-bottom: 8px;
      border-bottom: 1px solid #334155;
    }
    .title {
      font-size: 14px;
      font-weight: 700;
      color: #34d399;
    }
    .card {
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 8px;
      padding: 10px;
      margin-bottom: 10px;
    }
    .btn-col {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .btn-row {
      display: flex;
      gap: 6px;
    }
    button {
      background: #059669;
      color: #fff;
      border: none;
      border-radius: 6px;
      padding: 8px 10px;
      font-weight: 600;
      cursor: pointer;
    }
    button.secondary {
      background: #334155;
      flex: 1;
    }
    input[type="range"] {
      width: 100%;
    }
  </style>
</head>
<body>
  <div class="header">
    <div>
      <div class="title">🖨️ PrintClean PDF Studio</div>
      <div style="font-size:11px;color:#94a3b8;">Click-to-Delete Element Zapper & Clutter Stripper</div>
    </div>
    <span id="removedBadge" style="background:#064e3b;color:#a7f3d0;padding:3px 8px;border-radius:999px;font-weight:700;">0 Zapped</span>
  </div>

  <div class="card btn-col">
    <button id="toggleZapBtn">🗑️ Toggle Interactive Element Zapper</button>
    <div class="btn-row">
      <button class="secondary" id="stripClutterBtn">✨ Strip &lt;nav&gt;/&lt;aside&gt;/&lt;footer&gt;</button>
      <button class="secondary" id="undoZapBtn">↩ Undo Last Removal</button>
    </div>
  </div>

  <div class="card">
    <div style="display:flex;justify-content:space-between;margin-bottom:6px;">
      <strong>Print Typography Scale</strong>
      <span id="scaleLabel" style="color:#6ee7b7;">100%</span>
    </div>
    <input type="range" id="fontScaleInput" min="80" max="140" step="5" value="100">
    <button id="printPdfBtn" style="width:100%;margin-top:8px;">🖨️ Export Pristine Print / Save as PDF</button>
    <div id="statusMsg" style="font-size:11px;color:#4ade80;min-height:14px;margin-top:4px;"></div>
  </div>

  
  <div id="tm-subtle-donate" style="margin-top:10px;padding-top:7px;border-top:1px solid rgba(148,163,184,0.12);text-align:center;font-size:10.5px;color:#64748b;">
    100% Free Forever · <a href="https://influenzian-group.gitlab.io/Extensions/donate.html" target="_blank" rel="noopener" style="color:#94a3b8;text-decoration:none;">☕ Support Free Open Tools (Optional)</a>
  </div>

  <script src="popup.js"></script>
</body>
</html>
