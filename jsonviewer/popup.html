  h2 { margin: 0 0 4px; font-size: 15px; color: #34d399; display: flex; justify-content: space-between; align-items: center; }

  textarea { width: 100%; height: 85px; background: #090d16; color: #6ee7b7; border: 1px solid #334155; border-radius: 6px; padding: 7px 8px; font-family: monospace; font-size: 11px; resize: none; margin-bottom: 6px; }
