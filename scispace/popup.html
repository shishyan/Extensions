<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>SciSpace Research & Citation Assistant</title>
  <style>
    body { width: 400px; margin: 0; padding: 14px; background: #1e1b4b; color: #e0e7ff; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 12px; }
    h2 { margin: 0 0 8px; font-size: 15px; color: #818cf8; }
    .sec { background: #0f172a; border: 1px solid #4338ca; border-radius: 6px; padding: 8px; margin-bottom: 8px; font-size: 11px; line-height: 1.45; }
    .row { display: flex; gap: 6px; margin-bottom: 8px; }
    select, button { border-radius: 6px; padding: 6px 8px; font-size: 11px; font-weight: 700; }
    select { background: #0f172a; color: #e0e7ff; border: 1px solid #4338ca; }
    button { background: #6366f1; color: #fff; border: none; cursor: pointer; flex: 1; }
    pre { background: #090d16; border: 1px solid #3730a3; border-radius: 6px; padding: 8px; font-size: 10px; color: #c7d2fe; max-height: 115px; overflow: auto; margin: 0; white-space: pre-wrap; }
  </style>
</head>
<body>
  <h2>🔬 SciSpace — DOI, APA/MLA/Chicago/Harvard & BibTeX</h2>
  <div class="sec" id="ss-summary">Scanning active paper for DOI, arXiv ID & findings...</div>
  <div class="row">
    <select id="ss-style-sel">
      <option value="BibTeX">BibTeX (.bib)</option>
      <option value="APA">APA 7th</option>
      <option value="MLA">MLA 9th</option>
      <option value="Chicago">Chicago 17th</option>
      <option value="Harvard">Harvard</option>
    </select>
    <button id="ss-copy-bib">📋 Copy Citation</button>
    <button id="ss-save-lib" style="background:#4f46e5">+Save Library</button>
    <button id="ss-open-oa" style="background:#3730a3">🔓 OA PDF</button>
  </div>
  <pre id="ss-bibtex">@article{...}</pre>

  <div id="tm-subtle-donate" style="margin-top:8px;text-align:right;">
    <a href="https://paypal.me/influenzian" target="_blank" rel="noopener" style="display:inline-block;padding:3px 9px;border-radius:6px;background:rgba(30,41,59,0.7);border:1px solid rgba(148,163,184,0.2);color:#94a3b8;font-size:10.5px;font-weight:600;text-decoration:none;">Donate</a>
  </div>

  <script src="popup.js"></script>
</body>
</html>
