<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>SciSpace Research Assistant</title>
  <style>
    body {
      width: 390px;
      margin: 0;
      padding: 14px;
      background: #1e1b4b;
      color: #e0e7ff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      font-size: 12px;
    }
    h2 {
      margin: 0 0 8px;
      font-size: 15px;
      color: #818cf8;
    }
    .sec {
      background: #0f172a;
      border: 1px solid #4338ca;
      border-radius: 6px;
      padding: 8px;
      margin-bottom: 8px;
      font-size: 11px;
    }
    .row {
      display: flex;
      gap: 6px;
      margin-bottom: 8px;
    }
    button {
      background: #6366f1;
      color: #fff;
      border: none;
      border-radius: 6px;
      padding: 6px 10px;
      font-size: 11px;
      font-weight: 700;
      cursor: pointer;
      flex: 1;
    }
    pre {
      background: #090d16;
      border: 1px solid #3730a3;
      border-radius: 6px;
      padding: 8px;
      font-size: 10px;
      color: #c7d2fe;
      overflow: auto;
      margin: 0;
    }
  </style>
</head>
<body>
  <h2>🔬 SciSpace — DOI, OA PDF & BibTeX</h2>
  <div class="sec" id="ss-summary">Scanning active paper for DOI, arXiv ID & findings...</div>
  <div class="row">
    <button id="ss-copy-bib">📋 Copy BibTeX</button>
    <button id="ss-open-oa" style="background:#4f46e5">🔓 Open-Access Resolver</button>
  </div>
  <pre id="ss-bibtex">@article{...}</pre>

  <div id="tm-subtle-donate" style="margin-top:8px;text-align:right;">
    <a href="https://www.paypal.com/cgi-bin/webscr?cmd=_donations&business=nagaraj957%40gmail.com&item_name=Support+Free+Open+Extensions&currency_code=USD" target="_blank" rel="noopener" style="display:inline-block;padding:3px 9px;border-radius:6px;background:rgba(30,41,59,0.7);border:1px solid rgba(148,163,184,0.2);color:#94a3b8;font-size:10.5px;font-weight:600;text-decoration:none;">Donate</a>
  </div>

  <script src="popup.js"></script>
</body>
</html>
