<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>SpeechVoice — AI Text-to-Speech & Speed Reader</title>
<style>
  * { box-sizing: border-box; }
  body { width: 390px; margin: 0; padding: 14px; background: #0f172a; color: #f8fafc; font-family: system-ui, -apple-system, sans-serif; }
  h2 { margin: 0 0 4px; font-size: 15px; color: #38bdf8; display: flex; justify-content: space-between; align-items: center; }
  .badge { background: rgba(16,185,129,0.2); color: #34d399; border: 1px solid rgba(16,185,129,0.4); padding: 2px 8px; border-radius: 999px; font-size: 10px; }
  p.sub { margin: 0 0 8px; font-size: 11px; color: #94a3b8; }
  select, textarea { width: 100%; background: #1e293b; color: #f8fafc; border: 1px solid #334155; border-radius: 8px; padding: 7px; font-size: 11.5px; margin-bottom: 7px; font-family: inherit; }
  textarea { height: 78px; resize: vertical; }
  .controls { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; margin-bottom: 7px; }
  .ctrl-box { background: #1e293b; border: 1px solid #334155; border-radius: 8px; padding: 6px 8px; font-size: 10.5px; }
  .ctrl-box input { width: 100%; margin-top: 3px; }
  .btns { display: grid; grid-template-columns: repeat(4, 1fr); gap: 5px; }
  button.act { background: #38bdf8; color: #0f172a; border: none; padding: 8px 4px; border-radius: 6px; font-weight: 800; font-size: 11px; cursor: pointer; }
  button.act.sec { background: #334155; color: #f8fafc; }
</style>
</head>
<body>
  <h2><span>🔊 SpeechVoice Pro</span><span class="badge">HD Voices • Up to 4x</span></h2>
  <p class="sub">Natural Voice Selector, Speed & Pitch Control + Live Sentence Highlighting</p>

  <select id="voiceSelect"></select>

  <div class="controls">
    <div class="ctrl-box">
      <div style="display:flex;justify-content:space-between;"><span>⚡ Speed</span><strong id="rateLbl">1.25x</strong></div>
      <input type="range" id="rateRange" min="0.5" max="3.5" step="0.25" value="1.25">
    </div>
    <div class="ctrl-box">
      <div style="display:flex;justify-content:space-between;"><span>🎵 Pitch</span><strong id="pitchLbl">1.0</strong></div>
      <input type="range" id="pitchRange" min="0.6" max="1.6" step="0.1" value="1.0">
    </div>
  </div>

  <textarea id="ttsInput" placeholder="Paste text or click 'Read Page' to narrate active article with live sentence highlighting...">Welcome to SpeechVoice Pro. Enjoy unlimited high-speed text-to-speech narration with zero word limits.</textarea>

  <div class="btns">
    <button id="playBtn" class="act">▶ Play</button>
    <button id="pageBtn" class="act">📄 Page</button>
    <button id="pauseBtn" class="act sec">⏸ Pause</button>
    <button id="stopBtn" class="act sec">⏹ Stop</button>
  </div>

  <div id="tm-subtle-donate" style="margin-top:8px;text-align:right;">
    <a href="https://paypal.me/influenzian" target="_blank" rel="noopener" style="display:inline-block;padding:3px 9px;border-radius:6px;background:rgba(30,41,59,0.7);border:1px solid rgba(148,163,184,0.2);color:#94a3b8;font-size:10.5px;font-weight:600;text-decoration:none;">Donate</a>
  </div>

  <script src="popup.js"></script>
</body>
</html>
