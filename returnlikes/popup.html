<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>ReturnLikes — YouTube Dislike Counter & Engagement Ratio</title>
<style>
  * { box-sizing: border-box; }
  body { width: 375px; margin: 0; padding: 14px; background: #0f172a; color: #f8fafc; font-family: system-ui, -apple-system, sans-serif; }
  h2 { margin: 0 0 4px; font-size: 15px; color: #93c5fd; display: flex; justify-content: space-between; align-items: center; }
  .badge { background: rgba(59,130,246,0.2); color: #bfdbfe; border: 1px solid rgba(59,130,246,0.45); padding: 2px 8px; border-radius: 999px; font-size: 10px; }
  p.sub { margin: 0 0 10px; font-size: 11px; color: #94a3b8; }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 7px; margin-bottom: 10px; }
  .box { background: #1e293b; border: 1px solid #334155; border-radius: 8px; padding: 8px; text-align: center; }
  .lbl { font-size: 10px; color: #94a3b8; }
  .val { font-size: 14px; font-weight: 800; color: #93c5fd; margin-top: 2px; }
  .bar-bg { width: 100%; height: 8px; background: #ef4444; border-radius: 999px; overflow: hidden; margin-bottom: 10px; }
  .bar-fill { height: 100%; background: #22c55e; width: 97.6%; }
  button.act { width: 100%; background: #2563eb; color: #fff; border: none; padding: 8px; border-radius: 6px; font-weight: 800; font-size: 11px; cursor: pointer; }
</style>
</head>
<body>
  <h2><span>👍 ReturnLikes</span><span class="badge">RYD + Engagement Pro</span></h2>
  <p class="sub">Real-Time YouTube Dislike Counter, Sentiment Bar & LVR Meter</p>

  <div class="grid">
    <div class="box"><div class="lbl">👍 Likes</div><div class="val" id="likesVal">12,480</div></div>
    <div class="box"><div class="lbl">👎 Dislikes</div><div class="val" id="dislikesVal" style="color:#fca5a5;">312</div></div>
    <div class="box"><div class="lbl">💚 Approval Ratio</div><div class="val" id="ratioVal">97.6%</div></div>
    <div class="box"><div class="lbl">🔥 Like-to-View (LVR)</div><div class="val" id="lvrVal">8.4%</div></div>
  </div>

  <div class="bar-bg"><div id="barFill" class="bar-fill"></div></div>
  <button id="copyBtn" class="act">📋 Copy Engagement Report</button>
  
  <div id="tm-subtle-donate" style="margin-top:10px;padding-top:7px;border-top:1px solid rgba(148,163,184,0.12);text-align:center;font-size:10.5px;color:#64748b;">
    100% Free Forever · <a href="https://influenzian-group.gitlab.io/Extensions/donate.html" target="_blank" rel="noopener" style="color:#94a3b8;text-decoration:none;">☕ Support Free Open Tools (Optional)</a>
  </div>

  <script src="popup.js"></script>
</body>
</html>
