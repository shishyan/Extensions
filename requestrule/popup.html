<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>RequestRule — Redirect, Block, Query-Param Stripper & Mock Rule Studio</title>
<style>
  * { box-sizing: border-box; }
  body { width: 400px; margin: 0; padding: 14px; background: #0f172a; color: #f8fafc; font-family: system-ui, -apple-system, sans-serif; }
  h2 { margin: 0 0 4px; font-size: 15px; color: #fb923c; display: flex; justify-content: space-between; align-items: center; }
  .badge { background: rgba(234,88,12,0.2); color: #fdba74; border: 1px solid rgba(234,88,12,0.45); padding: 2px 8px; border-radius: 999px; font-size: 10px; }
  p.sub { margin: 0 0 8px; font-size: 11px; color: #94a3b8; }
  .stats { display: flex; justify-content: space-between; background: #1e293b; border: 1px solid #334155; border-radius: 6px; padding: 6px 10px; margin-bottom: 8px; font-size: 11px; }
  .card { background: #1e293b; border: 1px solid #334155; border-radius: 8px; padding: 8px; margin-bottom: 8px; font-size: 11px; }
  input, select { width: 100%; background: #0f172a; color: #f8fafc; border: 1px solid #334155; border-radius: 6px; padding: 6px 8px; font-size: 11px; margin-bottom: 5px; }
  .btns { display: flex; gap: 6px; }
  button.act { flex: 1.2; background: #ea580c; color: #fff; border: none; padding: 8px; border-radius: 6px; font-weight: 800; font-size: 11px; cursor: pointer; }
  button.sec { flex: 1; background: #334155; color: #fff; border: none; padding: 8px; border-radius: 6px; font-weight: 700; font-size: 11px; cursor: pointer; }
</style>
</head>
<body>
  <h2><span>⚡ RequestRule</span><span class="badge">Requestly Pro Free</span></h2>
  <p class="sub">Persistent Redirect, Block, Query-Param Stripper & Mock Rule Engine</p>

  <div class="stats">
    <span id="reqCount">🌐 Requests: 1</span>
    <span id="latVal" style="color:#4ade80;font-weight:700;">⏱️ Avg Latency: 14ms</span>
  </div>

  <div class="card">
    <div style="font-weight:700;margin-bottom:5px;">➕ Add Persistent HTTP Rule</div>
    <select id="actionSel">
      <option value="redirect">Redirect URL Pattern</option>
      <option value="block">Block Request Pattern</option>
      <option value="strip_params">Strip Tracking Query Params (utm_*, fbclid)</option>
      <option value="mock">Mock JSON Response</option>
    </select>
    <input id="matchInp" value="/api/v1/telemetry" placeholder="Match Pattern (e.g. /api/v1/*)" />
    <input id="mockInp" value='{"status":"mocked","ok":true}' placeholder="Redirect Target URL or Mock JSON" />
    <div class="btns">
      <button id="saveRuleBtn" class="act">💾 Save Rule</button>
      <button id="stripNowBtn" class="sec">🧹 Strip Page UTMs</button>
    </div>
  </div>

  <div class="card" id="rulesList" style="max-height:75px;overflow-y:auto;">Loading saved rules…</div>

  <div id="tm-subtle-donate" style="margin-top:8px;text-align:right;">
    <a href="https://paypal.me/influenzian" target="_blank" rel="noopener" style="display:inline-block;padding:3px 9px;border-radius:6px;background:rgba(30,41,59,0.7);border:1px solid rgba(148,163,184,0.2);color:#94a3b8;font-size:10.5px;font-weight:600;text-decoration:none;">Donate</a>
  </div>

  <script src="popup.js"></script>
</body>
</html>
