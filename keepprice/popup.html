<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>KeepPrice — 90-Day Price History & Drop Alert</title>
<style>
  * { box-sizing: border-box; }
  body { width: 390px; margin: 0; padding: 14px; background: #0f172a; color: #f8fafc; font-family: system-ui, -apple-system, sans-serif; }
  h2 { margin: 0 0 4px; font-size: 15px; color: #38bdf8; display: flex; justify-content: space-between; align-items: center; }
  .badge { background: rgba(56,189,248,0.2); color: #38bdf8; border: 1px solid rgba(56,189,248,0.4); padding: 2px 8px; border-radius: 999px; font-size: 10px; }
  p.sub { margin: 0 0 8px; font-size: 11px; color: #94a3b8; }
  .deal-banner { background: #1e293b; border: 1px solid #334155; border-radius: 8px; padding: 6px 10px; margin-bottom: 8px; font-size: 11px; display: flex; justify-content: space-between; align-items: center; }
  .grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; margin-bottom: 8px; }
  .stat { background: #1e293b; border: 1px solid #334155; border-radius: 8px; padding: 7px; text-align: center; }
  .stat .v { font-size: 13px; font-weight: 800; color: #34d399; }
  .stat .k { font-size: 9.5px; color: #94a3b8; }
  .chart-box { background: #1e293b; border: 1px solid #334155; border-radius: 8px; padding: 10px; margin-bottom: 8px; }
  .alert-box { display: flex; gap: 6px; align-items: center; background: #1e293b; border: 1px solid #334155; border-radius: 8px; padding: 8px; font-size: 11px; }
  input { flex: 1; background: #0f172a; color: #f8fafc; border: 1px solid #334155; border-radius: 6px; padding: 6px; font-size: 12px; }
  button.act { background: #0284c7; color: #fff; border: none; padding: 7px 11px; border-radius: 6px; font-weight: 700; font-size: 11px; cursor: pointer; }
</style>
</head>
<body>
  <h2><span>📉 KeepPrice Pro</span><span class="badge">90-Day Tracker</span></h2>
  <p class="sub" id="prodTitle">Scanning product price & 90-day historical trend...</p>

  <div class="deal-banner">
    <span>Buy Recommendation:</span>
    <strong id="dealVal" style="color:#34d399;">A+ (Near 90D Low)</strong>
  </div>

  <div class="grid">
    <div class="stat"><div class="v" id="curVal">$--</div><div class="k">Current</div></div>
    <div class="stat"><div class="v" id="lowVal">$--</div><div class="k">90D Low</div></div>
    <div class="stat"><div class="v" id="avgVal">$--</div><div class="k">90D Avg</div></div>
    <div class="stat"><div class="v" id="highVal" style="color:#f87171;">$--</div><div class="k">90D High</div></div>
  </div>

  <div class="chart-box">
    <div style="font-size:10px;color:#94a3b8;margin-bottom:4px;display:flex;justify-content:space-between;">
      <span>90-Day Price Trajectory (Day -90 → Today)</span>
      <span id="ptsCount">8 snapshots</span>
    </div>
    <svg id="sparkline" width="100%" height="68" viewBox="0 0 330 68"></svg>
  </div>

  <div class="alert-box">
    <span>Target $</span>
    <input type="number" id="targetInput" placeholder="39.99" step="0.01">
    <button id="saveAlertBtn" class="act">🔔 Watch Drop</button>
  </div>
  <div id="statusMsg" style="font-size:10.5px;color:#34d399;margin-top:5px;"></div>

  <div id="tm-subtle-donate" style="margin-top:8px;text-align:right;">
    <a href="https://paypal.me/influenzian" target="_blank" rel="noopener" style="display:inline-block;padding:3px 9px;border-radius:6px;background:rgba(30,41,59,0.7);border:1px solid rgba(148,163,184,0.2);color:#94a3b8;font-size:10.5px;font-weight:600;text-decoration:none;">Donate</a>
  </div>

  <script src="popup.js"></script>
</body>
</html>
