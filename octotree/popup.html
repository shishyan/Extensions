<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>OctoTree — IDE File Tree Sidebar, Search Filter & Markdown Exporter</title>
<style>
  * { box-sizing: border-box; }
  body { width: 390px; margin: 0; padding: 14px; background: #0f172a; color: #f8fafc; font-family: system-ui, -apple-system, sans-serif; }
  h2 { margin: 0 0 4px; font-size: 15px; color: #60a5fa; display: flex; justify-content: space-between; align-items: center; }
  .badge { background: rgba(37,99,235,0.2); color: #93c5fd; border: 1px solid rgba(59,130,246,0.45); padding: 2px 8px; border-radius: 999px; font-size: 10px; }
  p.sub { margin: 0 0 8px; font-size: 11px; color: #94a3b8; }
  input { width: 100%; background: #1e293b; color: #f8fafc; border: 1px solid #334155; border-radius: 6px; padding: 6px 8px; font-size: 11px; margin-bottom: 6px; }
  .box { background: #1e293b; border: 1px solid #334155; border-radius: 8px; padding: 8px; max-height: 185px; overflow-y: auto; font-size: 11px; margin-bottom: 8px; }
  .row { padding: 4px 0; border-bottom: 1px solid rgba(255,255,255,0.06); color: #e2e8f0; }
  .row:last-child { border-bottom: none; }
  button.act { width: 100%; background: #2563eb; color: #fff; border: none; padding: 8px; border-radius: 6px; font-weight: 800; font-size: 11px; cursor: pointer; }
</style>
</head>
<body>
  <h2><span>🐙 OctoTree</span><span class="badge">Octotree Pro Free</span></h2>
  <p class="sub">Collapsible GitHub Repo Tree Sidebar, Quick File Filter & Markdown Export</p>

  <input id="searchInp" placeholder="🔍 Filter repo files or document headings..." />
  <div id="treeBox" class="box">Scanning repository files and document headings...</div>
  <button id="copyTreeBtn" class="act">📋 Copy Repo File/Heading Tree (.MD)</button>

  <div id="tm-subtle-donate" style="margin-top:8px;text-align:right;">
    <a href="https://paypal.me/influenzian" target="_blank" rel="noopener" style="display:inline-block;padding:3px 9px;border-radius:6px;background:rgba(30,41,59,0.7);border:1px solid rgba(148,163,184,0.2);color:#94a3b8;font-size:10.5px;font-weight:600;text-decoration:none;">Donate</a>
  </div>

  <script src="popup.js"></script>
</body>
</html>
