<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>OctoTree — IDE File Tree & Code Navigator</title>
<style>
  * { box-sizing: border-box; }
  body { width: 380px; margin: 0; padding: 14px; background: #0f172a; color: #f8fafc; font-family: system-ui, -apple-system, sans-serif; }
  h2 { margin: 0 0 4px; font-size: 15px; color: #60a5fa; display: flex; justify-content: space-between; align-items: center; }
  .badge { background: rgba(37,99,235,0.2); color: #93c5fd; border: 1px solid rgba(59,130,246,0.45); padding: 2px 8px; border-radius: 999px; font-size: 10px; }
  p.sub { margin: 0 0 10px; font-size: 11px; color: #94a3b8; }
  .box { background: #1e293b; border: 1px solid #334155; border-radius: 8px; padding: 8px; max-height: 200px; overflow-y: auto; font-size: 11px; margin-bottom: 8px; }
  .row { padding: 4px 0; border-bottom: 1px solid rgba(255,255,255,0.06); color: #e2e8f0; }
  .row:last-child { border-bottom: none; }
  button.act { width: 100%; background: #2563eb; color: #fff; border: none; padding: 8px; border-radius: 6px; font-weight: 800; font-size: 11px; cursor: pointer; }
</style>
</head>
<body>
  <h2><span>🐙 OctoTree</span><span class="badge">Octotree Pro Free</span></h2>
  <p class="sub">Left-Docked IDE File Tree Sidebar & Code/Heading Navigator</p>

  <div id="treeBox" class="box">Scanning repository files and document headings...</div>
  <button id="copyTreeBtn" class="act">📋 Copy File/Heading Tree (.MD)</button>
  
  <div id="tm-subtle-donate" style="margin-top:10px;padding-top:7px;border-top:1px solid rgba(148,163,184,0.12);text-align:center;font-size:10.5px;color:#64748b;">
    100% Free Forever · <a href="https://influenzian-group.gitlab.io/Extensions/donate.html" target="_blank" rel="noopener" style="color:#94a3b8;text-decoration:none;">☕ Support Free Open Tools (Optional)</a>
  </div>

  <script src="popup.js"></script>
</body>
</html>
