<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>EditCookie & Storage Studio</title>
  <style>
    body { width: 390px; margin: 0; padding: 14px; background: #1c1917; color: #f5f5f4; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 12px; }
    h2 { margin: 0 0 8px; font-size: 15px; color: #fbbf24; }
    .card { background: #292524; border: 1px solid #44403c; border-radius: 8px; padding: 10px; margin-bottom: 8px; }
    .row { display: flex; gap: 6px; margin-bottom: 6px; }
    input, select { background: #1c1917; border: 1px solid #57534e; color: #f5f5f4; border-radius: 5px; padding: 5px 7px; font-size: 11px; flex: 1; }
    button { background: #d97706; color: #fff; border: none; border-radius: 6px; padding: 6px 8px; font-size: 10.5px; font-weight: 600; cursor: pointer; flex: 1; }
    button.secondary { background: #44403c; }
    button.danger { background: #dc2626; }
    pre { background: #0c0a09; padding: 8px; border-radius: 6px; font-size: 10px; max-height: 115px; overflow: auto; color: #fcd34d; margin: 6px 0 0; }
  </style>
</head>
<body>
  <h2>🍪 EditCookie & Storage Studio</h2>
  <div class="card">
    <div style="font-weight:600;margin-bottom:6px;">Add / Edit / Delete Cookie, LocalStorage or SessionStorage</div>
    <div class="row">
      <select id="ec-target" style="flex:0.9">
        <option value="cookie">Cookie</option>
        <option value="localStorage">localStorage</option>
        <option value="sessionStorage">sessionStorage</option>
      </select>
      <input id="ec-key" placeholder="Key (e.g. session_id)" value="debug_session" />
      <input id="ec-val" placeholder="Value" value="active_2026" />
    </div>
    <div class="row">
      <button id="ec-save-btn">Save Key</button>
      <button id="ec-del-btn" class="secondary">Delete Key</button>
      <button id="ec-export-btn" class="secondary">JSON</button>
      <button id="ec-netscape-btn" class="secondary">Netscape</button>
      <button id="ec-clear-btn" class="danger">Wipe All</button>
    </div>
  </div>
  <div class="card">
    <div style="font-weight:600;">Live Storage & Netscape Cookie Snapshot</div>
    <pre id="ec-output">Loading active tab cookies & storage...</pre>
  </div>

  <div id="tm-subtle-donate" style="margin-top:8px;text-align:right;">
    <a href="https://paypal.me/influenzian" target="_blank" rel="noopener" style="display:inline-block;padding:3px 9px;border-radius:6px;background:rgba(30,41,59,0.7);border:1px solid rgba(148,163,184,0.2);color:#94a3b8;font-size:10.5px;font-weight:600;text-decoration:none;">Donate</a>
  </div>

  <script src="popup.js"></script>
</body>
</html>
