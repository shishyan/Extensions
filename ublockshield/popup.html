<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>UBlockShield Ad & Tracker Zapper</title>
  <style>
    body {
      width: 370px;
      margin: 0;
      padding: 14px;
      background: #1c1917;
      color: #fef2f2;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      font-size: 12px;
    }
    h2 {
      margin: 0 0 8px;
      font-size: 15px;
      color: #f87171;
    }
    .stats {
      background: #292524;
      border: 1px solid #ef4444;
      border-radius: 8px;
      padding: 10px;
      margin-bottom: 10px;
      font-weight: 600;
    }
    .row {
      display: flex;
      gap: 6px;
      margin-bottom: 8px;
    }
    input {
      flex: 1;
      background: #0c0a09;
      border: 1px solid #57534e;
      color: #fff;
      border-radius: 6px;
      padding: 6px 8px;
      font-size: 11px;
    }
    button {
      background: #dc2626;
      color: #fff;
      border: none;
      border-radius: 6px;
      padding: 6px 10px;
      font-size: 11px;
      font-weight: 700;
      cursor: pointer;
    }
    pre {
      background: #0c0a09;
      border: 1px solid #44403c;
      border-radius: 6px;
      padding: 8px;
      font-size: 10px;
      color: #fca5a5;
      margin: 0;
      max-height: 130px;
      overflow: auto;
    }
  </style>
</head>
<body>
  <h2>🛡️ UBlockShield — Ad & Cookie Zapper</h2>
  <div class="stats" id="ub-stats">Scanning page for ads, cookie walls & trackers...</div>
  <div class="row">
    <input id="ub-rule" placeholder="Custom CSS filter (e.g. .promo-popup)" value=".sponsored-widget" />
    <button id="ub-add-rule">+Block Rule</button>
  </div>
  <div class="row">
    <button id="ub-zap" style="width:100%">⚡ Toggle Interactive Element Zapper</button>
  </div>
  <pre id="ub-rules-list">Loading cosmetic filter rules...</pre>
  <script src="popup.js"></script>
</body>
</html>
