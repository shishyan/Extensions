<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>VolMaster 600% Audio Booster & EQ</title>
  <style>
    body {
      width: 360px;
      margin: 0;
      padding: 14px;
      background: #2e1065;
      color: #f3e8ff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      font-size: 12px;
    }
    h2 {
      margin: 0 0 8px;
      font-size: 15px;
      color: #d8b4fe;
    }
    .card {
      background: #1e1b4b;
      border: 1px solid #6b21a8;
      border-radius: 8px;
      padding: 10px;
      margin-bottom: 10px;
    }
    input[type="range"] {
      width: 100%;
    }
    .row {
      display: flex;
      gap: 6px;
      margin-top: 6px;
    }
    button {
      flex: 1;
      background: #9333ea;
      color: #fff;
      border: none;
      border-radius: 6px;
      padding: 6px 8px;
      font-size: 11px;
      font-weight: 700;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <h2>🔊 VolMaster — 600% Gain & 3-Band EQ</h2>
  <div class="card">
    <div>Master Volume Gain: <strong id="vm-label">100%</strong></div>
    <input type="range" id="vm-slider" min="0" max="600" step="10" value="100" />
    <div class="row">
      <button data-v="100" data-p="Flat">100% Flat</button>
      <button data-v="200" data-p="Bass Boost">200% Bass</button>
      <button data-v="400" data-p="Vocal Clarity">400% Vocal</button>
      <button data-v="600" data-p="Max 600%">600% Max</button>
    </div>
  </div>
  <div class="card" id="vm-status">
    3-Band WebAudio BiquadFilter Ready (100Hz / 1kHz / 8kHz)
  </div>

  <div id="tm-subtle-donate" style="margin-top:8px;text-align:right;">
    <a href="https://influenzian-group.gitlab.io/Extensions/donate.html" target="_blank" rel="noopener" style="display:inline-block;padding:3px 9px;border-radius:6px;background:rgba(30,41,59,0.7);border:1px solid rgba(148,163,184,0.2);color:#94a3b8;font-size:10.5px;font-weight:600;text-decoration:none;">Donate</a>
  </div>

  <script src="popup.js"></script>
</body>
</html>
