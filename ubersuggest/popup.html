<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>UberSuggest — Live Keyword Research, CPC, KD% & Density Auditor</title>
<style>
  * { box-sizing: border-box; }
  body { width: 400px; margin: 0; padding: 13px; background: #0f172a; color: #f8fafc; font-family: system-ui, -apple-system, sans-serif; }
  h2 { margin: 0 0 4px; font-size: 15px; color: #fb7185; display: flex; justify-content: space-between; align-items: center; }
  .badge { background: rgba(249,115,22,0.2); color: #fb7185; border: 1px solid #fb7185; padding: 2px 8px; border-radius: 999px; font-size: 10px; }
  p.sub { margin: 0 0 8px; font-size: 11px; color: #94a3b8; }
  .search-bar { display: flex; gap: 5px; margin-bottom: 8px; }
  .search-bar input { flex: 1; background: #1e293b; color: #f8fafc; border: 1px solid #334155; border-radius: 6px; padding: 6px 8px; font-size: 11.5px; }
  .search-bar button { background: #fb7185; color: #fff; border: none; border-radius: 6px; padding: 6px 10px; font-weight: 700; font-size: 11px; cursor: pointer; }
  .list { background: #1e293b; border: 1px solid #334155; border-radius: 8px; padding: 8px; height: 170px; overflow-y: auto; font-size: 11px; margin-bottom: 8px; }
  .row { display: flex; justify-content: space-between; padding: 4px 0; border-bottom: 1px solid #334155; }
  .row:last-child { border-bottom: none; }
  .btns { display: flex; gap: 6px; }
  button.act { flex: 1; background: #fb7185; color: #fff; border: none; padding: 8px; border-radius: 6px; font-weight: 700; font-size: 11px; cursor: pointer; }
  button.act.sec { background: #334155; }
</style>
</head>
<body>
  <h2><span>🚀 UberSuggest Pro</span><span class="badge">Unlimited Keyword Data</span></h2>
  <p class="sub">Live Google Autocomplete Suggestions, Page Keyword Density, KD% & CPC</p>

  <div class="search-bar">
    <input id="seedInput" type="text" placeholder="Enter seed keyword for live autocomplete ideas..." />
    <button id="suggestBtn">Suggest</button>
  </div>

  <div class="list" id="kwTable">Extracting page keywords & live search suggestions...</div>

  <div class="btns">
    <button id="csvBtn" class="act">📥 Export Keywords CSV</button>
    <button id="copyBtn" class="act sec">📋 Copy Keyword List</button>
  </div>

  <div id="tm-subtle-donate" style="margin-top:8px;text-align:right;">
    <a href="https://paypal.me/influenzian" target="_blank" rel="noopener" style="display:inline-block;padding:3px 9px;border-radius:6px;background:rgba(30,41,59,0.7);border:1px solid rgba(148,163,184,0.2);color:#94a3b8;font-size:10.5px;font-weight:600;text-decoration:none;">Donate</a>
  </div>

  <script src="popup.js"></script>
</body>
</html>
