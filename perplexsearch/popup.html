<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>PerplexSearch — Citation-Backed Answer Synthesizer & Fact Checker</title>
<style>
  * { box-sizing: border-box; }
  body { width: 410px; margin: 0; padding: 14px; background: #0f172a; color: #f8fafc; font-family: system-ui, -apple-system, sans-serif; }
  .hdr { display: flex; justify-content: space-between; align-items: center; margin-bottom: 4px; }
  h2 { margin: 0; font-size: 16px; color: #2dd4bf; }
  .badge { background: rgba(20,184,166,0.2); color: #5eead4; border: 1px solid rgba(20,184,166,0.45); padding: 2px 8px; border-radius: 999px; font-size: 10px; font-weight: 700; }
  p.sub { margin: 0 0 10px; font-size: 11px; color: #94a3b8; }
  .search-row { display: flex; gap: 6px; margin-bottom: 10px; }
  input { flex: 1; background: #1e293b; color: #fff; border: 1px solid #334155; border-radius: 6px; padding: 7px 9px; font-size: 11.5px; outline: none; }
  input:focus { border-color: #14b8a6; }
  button.primary { background: #14b8a6; color: #042f2e; border: none; border-radius: 6px; padding: 7px 12px; font-size: 11.5px; font-weight: 800; cursor: pointer; }
  #synthesisBox { background: #1e293b; border: 1px solid #334155; border-radius: 8px; padding: 9px 10px; font-size: 11.5px; line-height: 1.45; color: #f1f5f9; margin-bottom: 8px; }
  .cite-card { background: #1e293b; border: 1px solid #334155; border-radius: 6px; padding: 7px 9px; margin-bottom: 6px; font-size: 11px; }
  .cite-card a { color: #2dd4bf; font-weight: 700; text-decoration: none; }
  .cite-card div { color: #94a3b8; font-size: 10.5px; margin-top: 2px; }
</style>
</head>
<body>
  <div class="hdr">
    <h2>🧭 PerplexSearch</h2>
    <span class="badge">Perplexity Pro Unlocked</span>
  </div>
  <p class="sub">Instant Citation-Backed Answer Synthesizer ([1], [2], [3]) • Wikipedia + DuckDuckGo</p>

  <div class="search-row">
    <input id="queryInput" type="text" value="Artificial intelligence" placeholder="Ask any research question or verify a claim..." />
    <button class="primary" id="searchBtn">🔍 Synthesize</button>
  </div>

  <div id="synthesisBox">Synthesizing multi-source answer with verified citations…</div>
  <div id="citationsList"></div>

  <div id="tm-subtle-donate" style="margin-top:8px;text-align:right;">
    <a href="https://influenzian-group.gitlab.io/Extensions/donate.html" target="_blank" rel="noopener" style="display:inline-block;padding:3px 9px;border-radius:6px;background:rgba(30,41,59,0.7);border:1px solid rgba(148,163,184,0.2);color:#94a3b8;font-size:10.5px;font-weight:600;text-decoration:none;">Donate</a>
  </div>

  <script src="popup.js"></script>
</body>
</html>
