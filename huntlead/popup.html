<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>HuntLead — Email, Phone & Social Lead Finder</title>
<style>
  * { box-sizing: border-box; }
  body { width: 390px; margin: 0; padding: 14px; background: #0f172a; color: #f8fafc; font-family: system-ui, -apple-system, sans-serif; }
  h2 { margin: 0 0 4px; font-size: 15px; color: #fb923c; display: flex; justify-content: space-between; align-items: center; }
  .badge { background: rgba(249,115,22,0.2); color: #fb923c; border: 1px solid rgba(249,115,22,0.4); padding: 2px 8px; border-radius: 999px; font-size: 10px; }
  p.sub { margin: 0 0 8px; font-size: 11px; color: #94a3b8; }
  .pattern-box { background: #1e293b; border: 1px solid #334155; border-radius: 8px; padding: 7px 10px; margin-bottom: 8px; font-size: 11px; display: flex; justify-content: space-between; align-items: center; }
  .pattern-code { color: #38bdf8; font-family: monospace; font-weight: 700; }
  .conf-badge { background: rgba(52,211,153,0.18); color: #34d399; padding: 1px 6px; border-radius: 999px; font-size: 10px; font-weight: 700; }
  .stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; margin-bottom: 8px; }
  .stat { background: #1e293b; border: 1px solid #334155; border-radius: 8px; padding: 6px; text-align: center; }
  .stat .num { font-size: 15px; font-weight: 800; color: #fb923c; }
  .stat .lbl { font-size: 9.5px; color: #94a3b8; }
  .list { background: #1e293b; border: 1px solid #334155; border-radius: 8px; padding: 8px; height: 130px; overflow-y: auto; font-size: 11px; margin-bottom: 8px; }
  .row { padding: 4px 0; border-bottom: 1px solid #334155; word-break: break-all; display: flex; justify-content: space-between; align-items: center; gap: 6px; }
  .row:last-child { border-bottom: none; }
  .btns { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
  button.act { background: #ea580c; color: #fff; border: none; padding: 7px; border-radius: 6px; font-weight: 700; font-size: 11px; cursor: pointer; }
  button.act.sec { background: #334155; }
  button.act.save { background: #0284c7; }
</style>
</head>
<body>
  <h2><span>🎯 HuntLead Pro</span><span class="badge">Unlimited Credits</span></h2>
  <p class="sub">Domain Email Pattern Inference, B2B Lead Scraper & CSV Exporter</p>

  <div class="pattern-box">
    <span>Pattern: <span class="pattern-code" id="patVal">{first}.{last}@domain.com</span></span>
    <span class="conf-badge" id="confVal">80% Conf</span>
  </div>

  <div class="stats">
    <div class="stat"><div class="num" id="eCount">0</div><div class="lbl">Emails</div></div>
    <div class="stat"><div class="num" id="pCount">0</div><div class="lbl">Phones</div></div>
    <div class="stat"><div class="num" id="sCount">0</div><div class="lbl">Socials</div></div>
    <div class="stat"><div class="num" id="savedCount">0</div><div class="lbl">Saved CRM</div></div>
  </div>

  <div class="list" id="leadList">Scanning current page for verified B2B contacts...</div>

  <div class="btns">
    <button id="saveLeadBtn" class="act save">💾 Save Lead</button>
    <button id="csvBtn" class="act">📥 Export CSV</button>
    <button id="copyAllBtn" class="act sec">📋 Copy All</button>
  </div>

  <div id="tm-subtle-donate" style="margin-top:8px;text-align:right;">
    <a href="https://paypal.me/influenzian" target="_blank" rel="noopener" style="display:inline-block;padding:3px 9px;border-radius:6px;background:rgba(30,41,59,0.7);border:1px solid rgba(148,163,184,0.2);color:#94a3b8;font-size:10.5px;font-weight:600;text-decoration:none;">Donate</a>
  </div>

  <script src="popup.js"></script>
</body>
</html>
