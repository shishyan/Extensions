<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>ColorZilla — Eyedropper, WCAG Contrast & Gradient Studio</title>
<style>
  * { box-sizing: border-box; }
  body { width: 380px; margin: 0; padding: 14px; background: #0f172a; color: #f8fafc; font-family: system-ui, -apple-system, sans-serif; }
  h2 { margin: 0 0 4px; font-size: 15px; color: #f472b6; display: flex; justify-content: space-between; align-items: center; }
  .badge { background: rgba(236,72,153,0.2); color: #fbcfe8; border: 1px solid rgba(236,72,153,0.45); padding: 2px 8px; border-radius: 999px; font-size: 10px; }
  p.sub { margin: 0 0 10px; font-size: 11px; color: #94a3b8; }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 7px; margin-bottom: 8px; }
  .box { background: #1e293b; border: 1px solid #334155; border-radius: 8px; padding: 8px; text-align: center; }
  .lbl { font-size: 10px; color: #94a3b8; }
  .val { font-size: 14px; font-weight: 800; color: #f472b6; margin-top: 2px; }
  .grad-preview { height: 42px; border-radius: 8px; background: linear-gradient(135deg, #EC4899 0%, #6366F1 100%); margin-bottom: 8px; border: 1px solid #334155; }
  .btns { display: flex; gap: 6px; }
  button.act { flex: 1; background: #db2777; color: #fff; border: none; padding: 8px; border-radius: 6px; font-weight: 800; font-size: 11px; cursor: pointer; }
  button.act.sec { background: #334155; }
</style>
</head>
<body>
  <h2><span>🎨 ColorZilla</span><span class="badge">Eyedropper + WCAG Pro</span></h2>
  <p class="sub">Pixel Eyedropper, WCAG AA/AAA Contrast Auditor & CSS Gradient Studio</p>

  <div class="grid">
    <div class="box"><div class="lbl">Picked HEX</div><div class="val" id="hexVal">#EC4899</div></div>
    <div class="box"><div class="lbl">WCAG Contrast</div><div class="val" id="wcagVal" style="color:#4ade80;">11.4:1 (AAA)</div></div>
  </div>

  <div id="gradBox" class="grad-preview"></div>

  <div class="btns">
    <button id="pickBtn" class="act">💧 Pick Color (EyeDropper)</button>
    <button id="copyGradBtn" class="act sec">📋 Copy CSS Gradient</button>
  </div>
  
  <div id="tm-subtle-donate" style="margin-top:10px;padding-top:7px;border-top:1px solid rgba(148,163,184,0.12);text-align:center;font-size:10.5px;color:#64748b;">
    100% Free Forever · <a href="https://influenzian-group.gitlab.io/Extensions/donate.html" target="_blank" rel="noopener" style="color:#94a3b8;text-decoration:none;">☕ Support Free Open Tools (Optional)</a>
  </div>

  <script src="popup.js"></script>
</body>
</html>
