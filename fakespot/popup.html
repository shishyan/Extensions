<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>FakeSpot — Review Authenticity Grader & Adjusted Rating</title>
<style>
  * { box-sizing: border-box; }
  body { width: 380px; margin: 0; padding: 14px; background: #0f172a; color: #f8fafc; font-family: system-ui, -apple-system, sans-serif; }
  h2 { margin: 0 0 4px; font-size: 15px; color: #60a5fa; display: flex; justify-content: space-between; align-items: center; }
  .badge { background: rgba(37,99,235,0.2); color: #93c5fd; border: 1px solid rgba(59,130,246,0.45); padding: 2px 8px; border-radius: 999px; font-size: 10px; }
  p.sub { margin: 0 0 10px; font-size: 11px; color: #94a3b8; }
  .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; margin-bottom: 8px; }
  .box { background: #1e293b; border: 1px solid #334155; border-radius: 8px; padding: 8px; text-align: center; }
  .lbl { font-size: 10px; color: #94a3b8; }
  .val { font-size: 15px; font-weight: 800; color: #60a5fa; margin-top: 2px; }
  .card { background: #1e293b; border: 1px solid #334155; border-radius: 8px; padding: 9px; margin-bottom: 8px; font-size: 11px; }
  .row { display: flex; justify-content: space-between; margin-bottom: 4px; }
  button.act { width: 100%; background: #2563eb; color: #fff; border: none; padding: 8px; border-radius: 6px; font-weight: 800; font-size: 11px; cursor: pointer; }
</style>
</head>
<body>
  <h2><span>🛡️ FakeSpot</span><span class="badge">Fakespot Pro Free</span></h2>
  <p class="sub">Review Authenticity Grader (A–F), Bot Detector & True Star Rating</p>

  <div class="grid">
    <div class="box"><div class="lbl">Review Grade</div><div class="val" id="gVal" style="color:#4ade80;">A</div></div>
    <div class="box"><div class="lbl">Raw Rating</div><div class="val" id="rVal">4.8★</div></div>
    <div class="box"><div class="lbl">Adjusted Rating</div><div class="val" id="aVal">4.5★</div></div>
  </div>

  <div class="card">
    <div class="row"><span>🔍 Review Blocks Scanned:</span><strong id="totVal">4</strong></div>
    <div class="row"><span>🤖 Suspicious/Incentivized Flagged:</span><strong id="susVal" style="color:#fca5a5;">0</strong></div>
    <div class="row" style="margin-bottom:0;"><span>✅ Verified Authentic Confidence:</span><strong id="pctVal" style="color:#4ade80;">96%</strong></div>
  </div>

  <button id="auditBtn" class="act">🔍 Re-Scan Page Reviews</button>

  <div id="tm-subtle-donate" style="margin-top:8px;text-align:right;">
    <a href="https://paypal.me/influenzian" target="_blank" rel="noopener" style="display:inline-block;padding:3px 9px;border-radius:6px;background:rgba(30,41,59,0.7);border:1px solid rgba(148,163,184,0.2);color:#94a3b8;font-size:10.5px;font-weight:600;text-decoration:none;">Donate</a>
  </div>

  <script src="popup.js"></script>
</body>
</html>
