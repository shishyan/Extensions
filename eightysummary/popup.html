<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>EightySummary — YouTube 8-Point Summary & Transcript Extractor</title>
<style>
  * { box-sizing: border-box; }
  body { width: 380px; margin: 0; padding: 14px; background: #0f172a; color: #f8fafc; font-family: system-ui, -apple-system, sans-serif; }
  h2 { margin: 0 0 4px; font-size: 15px; color: #fca5a5; display: flex; justify-content: space-between; align-items: center; }
  .badge { background: rgba(239,68,68,0.2); color: #fecaca; border: 1px solid rgba(239,68,68,0.45); padding: 2px 8px; border-radius: 999px; font-size: 10px; }
  p.sub { margin: 0 0 10px; font-size: 11px; color: #94a3b8; }
  .meta-bar { display: flex; justify-content: space-between; background: #1e293b; border: 1px solid #334155; border-radius: 6px; padding: 6px 10px; margin-bottom: 8px; font-size: 11px; color: #cbd5e1; }
  .box { background: #1e293b; border: 1px solid #334155; border-radius: 8px; padding: 8px; font-size: 12px; max-height: 240px; overflow-y: auto; }
  .pt-item { display: flex; gap: 7px; align-items: flex-start; margin-bottom: 6px; padding-bottom: 6px; border-bottom: 1px solid rgba(255,255,255,0.06); }
  .pt-item:last-child { margin-bottom: 0; padding-bottom: 0; border-bottom: none; }
  .ts-btn { background: rgba(239,68,68,0.2); color: #fca5a5; border: 1px solid rgba(239,68,68,0.4); border-radius: 4px; padding: 2px 5px; font-family: monospace; font-size: 10px; font-weight: 700; cursor: pointer; flex-shrink: 0; }
  .ts-btn:hover { background: #dc2626; color: #fff; }
  .btns { display: flex; gap: 6px; margin-top: 10px; }
  button.act { flex: 1; background: #dc2626; color: #fff; border: none; padding: 8px; border-radius: 6px; font-weight: 700; font-size: 11px; cursor: pointer; }
  button.act.sec { background: #334155; }
</style>
</head>
<body>
  <h2><span>✨ EightySummary</span><span class="badge">Eightify Pro Free</span></h2>
  <p class="sub">8-Point Timestamped YouTube Insights & 1-Click Transcript Exporter</p>
  <div id="meta" class="meta-bar"><span>🎬 8 Key Takeaways</span><span id="dur">⏱️ Length: --</span></div>
  <div id="out" class="box">Generating 8-point timestamped summary...</div>
  <div class="btns">
    <button id="copySummaryBtn" class="act">📋 Copy 8-Pt Summary</button>
    <button id="copyTxBtn" class="act sec">📜 Copy Transcript</button>
  </div>
  
  <div id="tm-subtle-donate" style="margin-top:10px;padding-top:7px;border-top:1px solid rgba(148,163,184,0.12);text-align:center;font-size:10.5px;color:#64748b;">
    100% Free Forever · <a href="https://influenzian-group.gitlab.io/Extensions/donate.html" target="_blank" rel="noopener" style="color:#94a3b8;text-decoration:none;">☕ Support Free Open Tools (Optional)</a>
  </div>

  <script src="popup.js"></script>
</body>
</html>
