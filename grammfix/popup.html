<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>GrammFix — AI Grammar & Clarity Checker</title>
<style>
  * { box-sizing: border-box; }
  body { width: 390px; margin: 0; padding: 14px; background: #0f172a; color: #f8fafc; font-family: system-ui, -apple-system, sans-serif; }
  h2 { margin: 0 0 4px; font-size: 15px; color: #38bdf8; display: flex; justify-content: space-between; align-items: center; }
  .badge { background: rgba(16,185,129,0.2); color: #34d399; border: 1px solid rgba(16,185,129,0.4); padding: 2px 8px; border-radius: 999px; font-size: 10px; }
  p.sub { margin: 0 0 10px; font-size: 11px; color: #94a3b8; }
  .tone-bar { display: flex; justify-content: space-between; align-items: center; background: #1e293b; border: 1px solid #334155; border-radius: 8px; padding: 6px 10px; margin-bottom: 8px; font-size: 11px; }
  .tone-pill { color: #fbbf24; font-weight: 700; }
  textarea { width: 100%; height: 96px; background: #1e293b; color: #f8fafc; border: 1px solid #334155; border-radius: 8px; padding: 9px; font-size: 12px; resize: vertical; font-family: inherit; }
  .metrics { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; margin: 8px 0; }
  .metric { background: #1e293b; border: 1px solid #334155; border-radius: 8px; padding: 6px; text-align: center; }
  .metric .lbl { font-size: 9.5px; color: #94a3b8; }
  .metric .val { font-size: 13px; font-weight: 700; color: #38bdf8; margin-top: 2px; }
  .btns { display: flex; gap: 6px; margin-top: 6px; }
  button.act { flex: 1; background: #0284c7; color: #fff; border: none; padding: 8px; border-radius: 6px; font-weight: 700; font-size: 11.5px; cursor: pointer; }
  button.act.secondary { background: #334155; color: #e2e8f0; }
  button.act.apply { background: #059669; }
  .issues { margin-top: 8px; max-height: 115px; overflow-y: auto; font-size: 11px; background: #1e293b; border-radius: 6px; padding: 8px; border: 1px solid #334155; }
  .issue-item { padding: 4px 0; border-bottom: 1px solid #334155; display: flex; justify-content: space-between; align-items: center; gap: 6px; }
  .issue-item:last-child { border-bottom: none; }
  .tag { font-size: 9px; padding: 1px 5px; border-radius: 4px; background: rgba(56,189,248,0.18); color: #38bdf8; font-weight: 700; }
</style>
</head>
<body>
  <h2><span>✍️ GrammFix Pro</span><span class="badge">100% Free Forever</span></h2>
  <p class="sub">Grammar, Flesch Readability, Tone Detector & 1-Click Page Fixer</p>

  <div class="tone-bar">
    <span>🎭 Detected Tone:</span>
    <span class="tone-pill" id="toneVal">⚖️ Neutral & Balanced</span>
  </div>

  <textarea id="input" placeholder="Paste or type text here, or click 'Pull Page Text'...">In order to accomodate a large number of users at this point in time, we have the ability to utilize our new system. Teh results was reviewed and we could of seperated the files prior to tomorrow.</textarea>

  <div class="metrics">
    <div class="metric"><div class="lbl">Clarity</div><div class="val" id="clarityVal">100%</div></div>
    <div class="metric"><div class="lbl">Flesch</div><div class="val" id="fleschVal">72</div></div>
    <div class="metric"><div class="lbl">Reading</div><div class="val" id="gradeVal">Grade 7</div></div>
    <div class="metric"><div class="lbl">Issues</div><div class="val" id="issueVal" style="color:#f87171;">0</div></div>
  </div>

  <div class="btns">
    <button id="fixBtn" class="act">⚡ Fix All Issues</button>
    <button id="pullBtn" class="act secondary">📥 Pull Page</button>
    <button id="pushBtn" class="act apply">📤 Fix on Page</button>
    <button id="copyBtn" class="act secondary">📋 Copy</button>
  </div>

  <div class="issues" id="issuesList">Click "Fix All Issues" to inspect grammar, spelling & conciseness improvements.</div>

  <div id="tm-subtle-donate" style="margin-top:8px;text-align:right;">
    <a href="https://paypal.me/influenzian" target="_blank" rel="noopener" style="display:inline-block;padding:3px 9px;border-radius:6px;background:rgba(30,41,59,0.7);border:1px solid rgba(148,163,184,0.2);color:#94a3b8;font-size:10.5px;font-weight:600;text-decoration:none;">Donate</a>
  </div>

  <script src="popup.js"></script>
</body>
</html>
