<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>SelectorGadget Studio</title>
  <style>
    body {
      width: 370px;
      margin: 0;
      padding: 14px;
      background: #2e1065;
      color: #f3e8ff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      font-size: 12px;
    }
    h2 {
      margin: 0 0 8px;
      font-size: 15px;
      color: #d8b4fe;
    }
    .row {
      display: flex;
      gap: 6px;
      margin-bottom: 8px;
    }
    input {
      background: #1e1b4b;
      border: 1px solid #7e22ce;
      color: #fff;
      border-radius: 6px;
      padding: 6px 8px;
      font-size: 11px;
      flex: 1;
    }
    button {
      background: #9333ea;
      color: #fff;
      border: none;
      border-radius: 6px;
      padding: 6px 10px;
      font-size: 11px;
      font-weight: 700;
      cursor: pointer;
    }
    .box {
      background: #1e1b4b;
      border: 1px solid #6b21a8;
      border-radius: 6px;
      padding: 8px;
      margin-bottom: 6px;
      font-family: monospace;
      font-size: 11px;
    }
  </style>
</head>
<body>
  <h2>🎯 SelectorGadget — CSS & XPath</h2>
  <div class="row">
    <input id="sg-query" placeholder="Test CSS Selector (e.g. table tr)" value="h1" />
    <button id="sg-test-btn">Evaluate</button>
  </div>
  <div class="box" id="sg-css">CSS: h1</div>
  <div class="box" id="sg-xpath">XPath: //h1</div>
  <div class="box" id="sg-pw">Playwright: page.locator('h1')</div>
  <div class="box" id="sg-matches">Matches: 1</div>
  <script src="popup.js"></script>
</body>
</html>
