<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>CalendMeet — Multi-TZ Slot & GCal Builder</title>
  <style>
    body {
      margin: 0;
      padding: 14px;
      width: 380px;
      background: #0f172a;
      color: #f8fafc;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      font-size: 12px;
    }
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
      padding-bottom: 8px;
      border-bottom: 1px solid #334155;
    }
    .title {
      font-size: 14px;
      font-weight: 700;
      color: #60a5fa;
    }
    .card {
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 8px;
      padding: 10px;
      margin-bottom: 10px;
    }
    .row {
      display: flex;
      gap: 6px;
      margin-bottom: 8px;
    }
    input, select {
      background: #0f172a;
      color: #f8fafc;
      border: 1px solid #334155;
      border-radius: 6px;
      padding: 6px 8px;
      font-size: 12px;
    }
    textarea {
      width: 100%;
      box-sizing: border-box;
      height: 105px;
      background: #0f172a;
      color: #e2e8f0;
      border: 1px solid #334155;
      border-radius: 6px;
      padding: 8px;
      font-size: 11px;
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      resize: none;
    }
    button {
      flex: 1;
      background: #2563eb;
      color: #fff;
      border: none;
      border-radius: 6px;
      padding: 7px 10px;
      font-weight: 600;
      cursor: pointer;
    }
    button.secondary {
      background: #334155;
    }
    a.gcal-link {
      display: block;
      margin-top: 6px;
      color: #93c5fd;
      word-break: break-all;
      font-size: 11px;
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <div class="header">
    <div>
      <div class="title">📅 CalendMeet Multi-TZ</div>
      <div style="font-size:11px;color:#94a3b8;">IST • EST • PST • CET • UTC Availability & GCal Link</div>
    </div>
    <span style="background:#1e3a8a;color:#bfdbfe;padding:3px 8px;border-radius:999px;font-weight:700;">5 TZs</span>
  </div>

  <div class="card">
    <div class="row">
      <input type="text" id="titleInput" value="Product & Engineering Sync" style="flex:1;" placeholder="Meeting Title">
      <select id="durationSelect">
        <option value="15">15 min</option>
        <option value="30" selected>30 min</option>
        <option value="45">45 min</option>
        <option value="60">60 min</option>
      </select>
    </div>
    <textarea id="slotsOutput" readonly></textarea>
    <div class="row" style="margin-top:8px;margin-bottom:0;">
      <button id="copySlotsBtn">Copy 3 Multi-TZ Slots</button>
      <button class="secondary" id="insertComposeBtn">Insert Into Page</button>
    </div>
    <a id="gcalUrlAnchor" class="gcal-link" href="https://calendar.google.com/calendar/render?action=TEMPLATE" target="_blank">Open 1-Click Google Calendar Template URL</a>
    <div id="statusMsg" style="font-size:11px;color:#4ade80;min-height:14px;margin-top:4px;"></div>
  </div>

  <div id="tm-subtle-donate" style="margin-top:8px;text-align:right;">
    <a href="https://influenzian-group.gitlab.io/Extensions/donate.html" target="_blank" rel="noopener" style="display:inline-block;padding:3px 9px;border-radius:6px;background:rgba(30,41,59,0.7);border:1px solid rgba(148,163,184,0.2);color:#94a3b8;font-size:10.5px;font-weight:600;text-decoration:none;">Donate</a>
  </div>

  <script src="popup.js"></script>
</body>
</html>
